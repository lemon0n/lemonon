<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>老林的ETF模型</title>
<style>
:root{
  --blue:#1d4ed8; --blue-d:#1e3a8a; --blue-l:#eef4ff; --blue-l2:#f7faff;
  --line:#d8e2f0; --bg:#f6f8fc; --text:#1f2d3d; --muted:#66758c;
  --up:#c0392b; --down:#148f5b; --warn:#b45309; --neu:#1d4ed8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:13px;color:var(--text);background:var(--bg);
}
*{box-sizing:border-box;border-radius:0!important}
body{margin:0}
.app{display:flex;flex-direction:column;height:100vh}
.top{height:56px;flex-shrink:0;background:var(--blue-d);color:#fff;display:flex;
  align-items:center;justify-content:space-between;padding:0 20px;border-bottom:3px solid var(--blue)}
.brand{display:flex;align-items:center;gap:12px}
.mark{background:#fff;color:var(--blue-d);font-weight:800;font-size:14px;padding:5px 9px;letter-spacing:.5px}
.brand .t{font-size:15px;font-weight:650}
.top-r{font-size:12px;display:flex;align-items:center}
.dot{display:inline-block;width:7px;height:7px;background:#4ade80;margin-right:8px}
.body{display:flex;flex:1;min-height:0}
.side{width:196px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;transition:width .18s ease}
.side-toggle{width:100%;height:34px;flex-shrink:0;background:#fff;border:0;
  border-bottom:1px solid var(--line);color:var(--muted);font-family:inherit;
  font-size:13px;line-height:1;cursor:pointer;letter-spacing:2px}
.side-toggle:hover{background:var(--blue-l2);color:var(--blue)}
.nav-i{display:flex;align-items:center;gap:10px;padding:13px 18px;
  border-left:3px solid transparent;border-bottom:1px solid var(--line);
  cursor:pointer;color:var(--text);font-size:13px;white-space:nowrap}
.nav-i .ic{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700;background:var(--blue-l);color:var(--blue-d)}
.nav-i:hover{background:var(--blue-l2)}
.nav-i.on{border-left-color:var(--blue);background:var(--blue-l);color:var(--blue-d);font-weight:650}
.side-foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;white-space:nowrap}
.side-unlock{color:var(--blue);font-weight:650;cursor:pointer}
.side-unlock:hover{text-decoration:underline}
/* 收起态：只留图标，正文区域变宽 */
.side.collapsed{width:56px}
.side.collapsed .nav-i{padding:13px 0;justify-content:center;gap:0}
.side.collapsed .nav-i .lb{display:none}
.side.collapsed .side-foot{display:none}
.content{flex:1;overflow-y:auto;padding:22px 26px 60px}
.page{display:none}
.page.on{display:block}
.pg-h{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--blue);
  padding-bottom:9px;margin-bottom:16px}
.pg-h h1{font-size:19px;margin:0;color:var(--blue-d)}
.pg-h .sub{font-size:12px;color:var(--muted)}
.sec{display:flex;align-items:center;gap:9px;margin:24px 0 11px;font-size:13px;
  font-weight:700;color:var(--blue-d)}
.sec .bar{width:3px;height:14px;background:var(--blue)}
.sec .info{margin-left:1px}
.sec-lg{margin-top:30px;padding-bottom:8px;font-size:16px;border-bottom:1px solid var(--line)}
.sec-lg .bar{width:4px;height:17px}
.sec-details{margin:24px 0 11px}
.sec-details>summary{list-style:none;cursor:pointer;margin:0;padding-bottom:7px;border-bottom:1px solid transparent}
.sec-details>summary::-webkit-details-marker{display:none}
.sec-details[open]>summary{border-bottom-color:var(--line)}
.sec-detail{font-size:11.5px;color:var(--muted);line-height:1.7;padding:7px 0 2px 12px}
.sec-sub{margin:16px 0 8px;font-size:12px;font-weight:650;color:#5b6673}
.portfolio-nav{position:sticky;top:0;z-index:20;display:flex;gap:4px;overflow-x:auto;white-space:nowrap;
  margin:0 -4px 16px;padding:7px 4px;background:rgba(246,248,252,.97);border-bottom:1px solid var(--line)}
.portfolio-nav button{flex:0 0 auto;border:0;border-bottom:2px solid transparent;background:transparent;
  padding:7px 12px;font:inherit;color:var(--muted);cursor:pointer}
.portfolio-nav button:hover,.portfolio-nav button.active{color:var(--blue-d);border-bottom-color:var(--blue);background:#fff}
.portfolio-section{scroll-margin-top:78px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:20px}
.portfolio-empty{padding:12px 14px;background:var(--blue-l2);border-left:3px solid var(--line);color:var(--muted)}
.evidence-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.evidence-status{display:inline-block;padding:2px 6px;margin:0 0 7px;font-size:10.5px;border:1px solid var(--line);color:var(--muted)}
.evidence-status.snapshot{background:#fff5e6;color:#8a5b0b;border-color:#ead6aa}
.evidence-status.live{background:#e8f6ef;color:#12623e;border-color:#bfe6d2}
.evidence-date{font-size:11px;line-height:1.6;color:var(--muted);margin:5px 0 8px}
.info{display:inline-flex;width:15px;height:15px;align-items:center;justify-content:center;border:1px solid var(--muted);
  font-size:10px;font-style:normal;color:var(--muted);cursor:help;vertical-align:1px}
.info:focus{outline:2px solid var(--blue);outline-offset:2px}
.box{background:#fff;border:1px solid var(--line);padding:14px 16px;margin-bottom:12px}
.box.tight{padding:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12px}
.kv .k{color:var(--muted);white-space:nowrap}
.kv .v{text-align:right;font-variant-numeric:tabular-nums}
.kv2{display:grid;grid-template-columns:1fr 1fr}
.kv2 .kv:nth-child(odd){padding-right:20px;border-right:1px solid var(--line)}
.kv2 .kv:nth-child(even){padding-left:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;color:var(--muted);background:var(--blue-l2);
  border:1px solid var(--line);padding:3px 8px}
.chip b{color:var(--blue-d);font-variant-numeric:tabular-nums;margin-left:2px}
.kpi{background:#fff;border:1px solid var(--line);padding:12px 14px}
.kpi .k{font-size:11.5px;color:var(--muted)}
.kpi .v{font-size:21px;font-weight:750;color:var(--blue-d);font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .d{font-size:11px;color:var(--muted);margin-top:3px}
.kpi .v.warn,.d.warn{color:var(--warn)}
.kpi .v.up{color:var(--up)} .kpi .v.down{color:var(--down)}
.up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)} .neu{color:var(--neu)}
.muted{color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{background:var(--blue-l);color:var(--blue-d);font-weight:650;text-align:left;
  padding:8px 10px;border:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 10px;border:1px solid var(--line);vertical-align:top}
.tbl tr:nth-child(even) td{background:var(--blue-l2)}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.l,.tbl th.l{text-align:left}
.tag{display:inline-block;padding:1px 7px;font-size:10.5px;font-weight:650;
  border:1px solid var(--line);background:var(--blue-l);color:var(--blue-d)}
.tag.buy{background:#fdecea;color:var(--up);border-color:#f3c6c0}
.tag.sell{background:#e8f6ef;color:var(--down);border-color:#bfe6d2}
.tag.hold{background:var(--blue-l);color:var(--blue-d)}
.tag.watch{background:#fff5e6;color:var(--warn);border-color:#f0d9ac}
.dg{display:inline-block;width:19px;height:19px;line-height:19px;text-align:center;
  font-weight:800;color:#fff;background:var(--blue)}
.dg.A{background:#15803d} .dg.B{background:#1d4ed8}
.dg.C{background:#b45309} .dg.D{background:#b91c1c}
/* 持仓设置：操作按钮与可编辑表格（数据只存本机浏览器） */
.bar-actions{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.btn{background:var(--blue);color:#fff;border:1px solid var(--blue);padding:5px 14px;
  font-size:12px;font-weight:650;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--blue-d)}
.btn.ghost:hover{background:var(--blue-l)}
#saveMsg{font-size:11.5px;color:var(--muted)}
.tbl.edit td{padding:2px 3px}
.tbl.edit input{width:100%;border:1px solid var(--line);background:#fff;padding:4px 6px;
  font-family:inherit;font-size:12px;color:inherit}
.tbl.edit input:focus{outline:1px solid var(--blue);outline-offset:-1px}
.tbl.edit .cat-cell{min-width:104px}
.tbl.edit .cat-cell select{width:100%;border:1px solid var(--line);background:#fff;padding:4px 6px;
  font-family:inherit;font-size:12px;color:inherit}
.tbl.edit .cat-cell select:focus{outline:1px solid var(--blue);outline-offset:-1px}
.tbl.edit .cat-hint{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.3}
.qadd{display:flex;gap:8px;flex-wrap:wrap}
.qadd input{border:1px solid var(--line);background:#fff;padding:6px 8px;font-family:inherit;
  font-size:12.5px;width:150px}
.qadd input#qCode{width:170px}
.qadd input:focus{outline:1px solid var(--blue);outline-offset:-1px}
.foot-note{font-size:10.5px;color:var(--muted);padding:10px 2px 20px}
.cfg summary{cursor:pointer;font-size:12.5px;font-weight:650;color:var(--blue-d)}
.cfg[open] summary{margin-bottom:6px}
.encbox{position:fixed;inset:0;background:rgba(18,28,24,.55);display:flex;align-items:center;
  justify-content:center;z-index:80;padding:20px}
.encbox-in{background:#fff;max-width:660px;width:100%;padding:18px 20px;border:1px solid var(--line)}
.encbox-t{font-size:15px;font-weight:700;margin-bottom:4px}
.encbox textarea{width:100%;height:120px;font-family:ui-monospace,Menlo,monospace;font-size:11px;
  border:1px solid var(--line);padding:8px;margin:8px 0;resize:vertical}
.encbox a.btn{text-decoration:none;display:inline-block}
.del{background:#fff;border:1px solid var(--line);color:var(--up);font-size:11px;
  padding:2px 7px;cursor:pointer;font-family:inherit}
.del:hover{border-color:var(--up)}
.kpi input{width:100%;border:1px solid var(--line);padding:4px 6px;margin-top:4px;
  font-family:inherit;font-size:15px;font-weight:650;color:var(--blue-d)}
.notice code{background:#fff;border:1px solid #f0d9ac;padding:0 3px;font-size:11px}
.heatmap{position:relative;width:100%;height:430px;background:#fff;
  border:1px solid var(--line);overflow:hidden}
.heatmap .hm{position:absolute;box-sizing:border-box;border:1px solid #fff;
  padding:5px 4px;font-size:10.5px;line-height:1.25;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;cursor:pointer;transition:filter .12s}
.heatmap .hm:hover{filter:brightness(1.08);z-index:2}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.34);display:none;
  align-items:center;justify-content:center;z-index:60}
.modal.on{display:flex}
.modal-box{background:#fff;border:1px solid var(--line);min-width:260px;max-width:340px;
  box-shadow:0 8px 28px rgba(15,23,42,.18)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:10px 14px;background:var(--blue-l2);border-bottom:1px solid var(--line);
  font-weight:650;color:var(--blue-d);font-size:13px}
.modal-x{cursor:pointer;font-size:17px;line-height:1;color:var(--muted)}
.modal-x:hover{color:var(--up)}
.modal-b{padding:12px 14px}
.heatmap .hm b{font-weight:600;max-width:100%;line-height:1.2;
  overflow-wrap:anywhere;word-break:break-all}
.heatmap .hm i{font-style:normal;opacity:.92;font-variant-numeric:tabular-nums}
@media (max-width:900px){.heatmap{height:320px}}
@media (max-width:760px){
  .evidence-grid{grid-template-columns:1fr}
  .portfolio-nav{margin-left:-12px;margin-right:-12px;padding-left:8px;padding-right:8px}
  .portfolio-nav button{padding:8px 10px}
  .portfolio-section{scroll-margin-top:74px}
}
.bar-row{display:grid;grid-template-columns:88px 1fr 52px;gap:9px;align-items:center;
  font-size:11.5px;margin:6px 0}
.bar-row .n{color:var(--muted)}
.bar-row .t{height:12px;background:var(--blue-l);position:relative}
.bar-row .t i{display:block;height:100%;background:var(--blue)}
.bar-row .v{text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:11.5px;line-height:1.7;color:var(--muted);margin:8px 0 0}
.note .k{color:var(--blue-d);font-weight:700}
.leg{border:1px solid var(--line);background:#fff;margin-bottom:12px}
.leg-h{display:flex;align-items:center;gap:10px;padding:10px 14px;
  border-bottom:1px solid var(--line);background:var(--blue-l2)}
.leg-h .code{font-weight:750;color:var(--blue-d);font-size:13px}
.leg-h .nm{font-weight:650}
.leg-h .sp{margin-left:auto;font-size:11.5px;color:var(--muted)}
.leg-b{padding:12px 14px}
.leg-b .grid2>div:first-child{padding-right:18px;border-right:1px solid var(--line)}
.leg-b .grid2>div:last-child{padding-left:18px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.mini .m{border:1px solid var(--line);padding:7px 9px;background:var(--blue-l2)}
.mini .m .k{font-size:10.5px;color:var(--muted)}
.mini .m .v{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
/* 今日建议（第一模块） */
.adv{border:1px solid var(--line);background:#fff;margin-bottom:12px}
.adv-h{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 14px;
  background:var(--blue-l2);border-bottom:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.adv-h b{font-size:13px;color:var(--blue-d)}
.adv-b{padding:12px 14px}
.mini-2{font-size:11.5px;line-height:1.75;color:var(--muted);margin-bottom:10px}
.adv-b .mini-2 b,.adv-b .mini-2{color:var(--muted)}
/* 组合体检的一行指标条 */
.strip{display:flex;flex-wrap:wrap;gap:6px 18px;padding:9px 12px;margin-bottom:12px;
  border:1px solid var(--line);background:var(--blue-l2);font-size:11.5px;color:var(--muted)}
.strip b{color:var(--blue-d);font-variant-numeric:tabular-nums;margin-left:3px}
.strip .warn b{color:var(--warn)}
/* 逐只分析顶部的动作条 */
.adv-s{display:flex;align-items:baseline;gap:10px;padding:9px 14px 0}
.adv-p{font-size:12px;color:var(--blue-d);font-weight:650}
.adv-w{padding:3px 14px 9px;font-size:11.5px;color:var(--muted);line-height:1.65}
.lk{font-size:12px;line-height:1.85;color:var(--blue-d)}
.lk b{font-variant-numeric:tabular-nums}
.hl{border-left:3px solid var(--blue);background:var(--blue-l2);padding:9px 12px;
  font-size:11.5px;line-height:1.7;margin-top:8px}
.hl b{color:var(--blue-d)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.news{list-style:none;margin:0;padding:0;font-size:12px}
.news li{padding:6px 0;border-bottom:1px dashed var(--line)}
.news li:last-child{border-bottom:0}
.news .tm{color:var(--blue);font-weight:650;margin-right:8px;font-variant-numeric:tabular-nums}
.err{color:var(--up);font-size:12px;padding:20px}
.foot{font-size:11px;color:var(--muted);border-top:1px solid var(--line);margin-top:26px;padding-top:10px}
/* 区块标题 */
.bt{font-weight:650;color:var(--blue-d);margin-bottom:8px}
/* 来源链接 */
.src{color:var(--blue);text-decoration:none;margin-left:5px;font-size:11px;font-weight:700}
.src:hover{text-decoration:underline}
a.inl{color:var(--blue-d);text-decoration:none;border-bottom:1px dotted var(--blue);cursor:pointer}
a.inl:hover{color:var(--blue);border-bottom-style:solid}
/* 顶栏：数据源标记 + 手动刷新 */
.badge{display:inline-block;padding:2px 8px;font-size:11px;font-weight:650;margin-right:12px;
  border:1px solid rgba(255,255,255,.45);color:#fff;white-space:nowrap}
.badge.live{background:#148f5b;border-color:#148f5b}
.badge.degraded{background:#b45309;border-color:#b45309}
.btn-refresh{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55);
  padding:4px 11px;font-size:11.5px;font-weight:650;cursor:pointer;font-family:inherit;
  margin-right:14px;white-space:nowrap}
.btn-refresh:hover{background:rgba(255,255,255,.14)}
.btn-refresh:disabled{opacity:.55;cursor:default}
/* 页脚免责与降级提示 */
.notice{margin-top:14px;padding:10px 12px;background:#fffdf5;border:1px solid #f0d9ac;
  font-size:11.5px;color:#7a5a12;line-height:1.7}
.notice b{color:var(--warn)}
.notice.err{background:#fdf2f1;border-color:#f3c6c0;color:#8c2b20}
.notice.err b{color:var(--up)}
.flash{color:#e9f6ee;font-size:11.5px;margin-right:12px}
/* 持仓口令锁：仓库里只有密文，解锁后才显示持仓页 */
.lock{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;
  background:rgba(18,32,56,.58);padding:20px}
.lock.on{display:flex}
.lock-box{width:370px;max-width:94vw;background:#fff;border:1px solid var(--line);
  padding:24px 24px 16px;box-shadow:0 18px 44px rgba(12,30,60,.3)}
.lock-t{font-size:16px;font-weight:750;color:var(--blue-d)}
.lock-d{font-size:11.5px;line-height:1.75;color:var(--muted);margin:8px 0 14px}
.lock-box input[type=password]{width:100%;border:1px solid var(--line);padding:9px 10px;
  font-family:inherit;font-size:13px;color:var(--text)}
.lock-box input[type=password]:focus{outline:1px solid var(--blue);outline-offset:-1px}
.lock-rm{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin:9px 0 14px}
.lock-btns{display:flex;gap:8px;flex-wrap:wrap}
.lock-msg{min-height:16px;margin-top:10px;font-size:11.5px;color:var(--warn);line-height:1.6}
.nav-i.hide{display:none}

/* ---- S5 今日操作简报（组合层简报 + 逐条逻辑链卡）---- */
.brief{border:1px solid var(--line);background:#fff;padding:10px 12px;margin:10px 0}
.brief-top{background:var(--blue-l2)}
.b-t{font-size:12px;color:var(--blue-d);font-weight:650;padding-bottom:6px;
  border-bottom:1px dashed var(--line);margin-bottom:6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.b-src{font-size:10.5px;color:var(--muted);font-weight:400}
.b-row{display:flex;gap:10px;padding:3px 0;font-size:12px;line-height:1.7}
.b-k{flex:0 0 36px;text-align:center;font-size:11px;color:var(--blue-d);
  background:var(--blue-l2);border:1px solid var(--line);border-radius:3px;
  padding:1px 0;height:-moz-fit-content;height:fit-content;margin-top:3px}
.b-v{flex:1;color:var(--text)}
.b-cap{font-size:11px;color:var(--muted);margin:12px 0 2px;padding-left:2px}

</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><span class="mark">ETF</span><span class="t">老林的ETF模型</span></div>
    <div class="top-r">
      <span id="flash" class="flash"></span>
      <span id="statusBadge" class="badge"></span>
      <span id="srcBadge" class="badge"></span>
      <button id="btnRefresh" class="btn-refresh" onclick="refreshQuotes()" title="用免费行情接口拉取最新价格">刷新行情</button>
      <span class="dot"></span><span id="updateTime">最新更新 —</span>
    </div>
  </div>
  <div class="body">
    <div class="side" id="side">
      <button class="side-toggle" id="sideToggle" type="button" onclick="toggleSide()"

        Math.abs(tw - (curW || 0)) < band) {
      targetShares = curShares;
      d.applied.push('不换仓带：偏离 ' + pct2(Math.abs(tw - (curW || 0))) +
        'pct < ' + band + 'pct，不交易');
    }

    var delta = targetShares - curShares;
    d.target_shares = targetShares;
    d.delta_shares = delta;
    d.notional = pyRound(delta * price, 2);
    d.fee = delta ? pyRound(computeFee(delta * price, constraints(cfg)), 2) : 0.0;
    d.applied.push('取整：按 ' + lot + ' 份最小申报单位');
    return d;
  }

  /* 先卖后买；现金不足时按确定性顺序降低买入手数。 */
  function settle(drafts, snap, cfg) {
    var c = constraints(cfg);
    var lot = Math.floor(cNum(c, 'lot_size', 100));
    var slip = cNum(c, 'slippage_bps', 1.0) / 10000.0;
    var cash = num(snap.cash) || 0;
    var sells = [], buys = [];
    drafts.forEach(function (d) {
      var delta = d.delta_shares || 0;
      if (delta < 0) sells.push(d);
      else if (delta > 0) buys.push(d);
    });
    buys.sort(function (a, b) {
      var na = a.notional || 0, nb = b.notional || 0;
      if (na !== nb) return na - nb;
      return a.code < b.code ? -1 : (a.code > b.code ? 1 : 0);
    });

    sells.forEach(function (d) {
      var delta = d.delta_shares;
      d.funded_by = '卖出回款';
      cash += Math.abs(delta) * d.price * (1 - slip) - (d.fee || 0);
    });

    buys.forEach(function (d) {
      var px = d.price * (1 + slip);
      var want = d.delta_shares;
      var affordable = lotFloor((cash - Math.abs(d.fee || 0)) / px, lot);
      if (affordable < want) {
        while (affordable > 0 &&
               (affordable * px + computeFee(affordable * px, c)) > cash) {
          affordable -= lot;
        }
        affordable = Math.max(0, lotFloor(affordable, lot));
        if (affordable <= 0) {
          d.target_shares = d.current_shares;
          d.delta_shares = 0.0;
          d.notional = 0.0;
          d.fee = 0.0;
          d.blocked_by.push('买入现金不足：本次不发布该订单');
          d.applied.push('现金不足：订单降为 0 手');
          return;
        }
        d.target_shares = d.current_shares + affordable;
        d.delta_shares = affordable;
        d.notional = pyRound(affordable * d.price, 2);
        d.fee = pyRound(computeFee(d.notional, c), 2);
        d.applied.push('现金不足：按可负担手数下调至 ' + affordable + ' 份');
      }
      d.funded_by = sells.length ? '卖出回款' : '现金';
      cash -= d.delta_shares * px + (d.fee || 0);
    });
    return cash;
  }

  /* 按执行后实际份额计算组合结构。 */
  function portfolioAfter(drafts, cash, cfg) {
    var pos = 0, cat = {}, bucket = {}, mvs = [];
    drafts.forEach(function (d) {
      var shares = d.target_shares, price = d.price;
      if (shares === null || shares === undefined ||
          price === null || price === undefined) return;
      var mv = shares * price;
      pos += mv;
      mvs.push(mv);
      var k = d.category || '未分类';
      cat[k] = (cat[k] || 0) + mv;
      var b = d.bucket || '未分类';
      bucket[b] = (bucket[b] || 0) + mv;
    });
    var asset = pos + cash;
    function pc(v) { return asset > 0 ? pyRound(v / asset * 100, 2) : null; }
    var equity = (bucket['境内权益'] || 0) + (bucket['海外权益'] || 0);
    var hhi = null;
    if (pos > 0) {
      hhi = 0;
      mvs.forEach(function (m) { var w = m / pos; hhi += w * w; });
    }
    var catPct = {}, bucketPct = {};
    Object.keys(cat).forEach(function (k) { catPct[k] = pc(cat[k]); });
    Object.keys(bucket).forEach(function (k) { bucketPct[k] = pc(bucket[k]); });
    return {
      total_asset: pyRound(asset, 2),
      cash: pyRound(cash, 2),
      market_value: pyRound(pos, 2),
      position_pct: pc(pos),
      cash_pct: pc(cash),
      risk_position_pct: pc(equity),
      max_single_pct: mvs.length ? pc(Math.max.apply(null, mvs)) : null,
      hhi: hhi === null ? null : pyRound(hhi, 4),
      effective_n: hhi ? pyRound(1 / hhi, 2) : null,
      category_pct: catPct,
      bucket_pct: bucketPct,
      legs: drafts.filter(function (d) { return (d.target_shares || 0) > 0; }).length,
      filled: false,
      diagnostic: false
    };
  }

  /* 按执行后实际份额复核约束。既有超限只提示，不阻断无关订单。 */
  function validateAfter(drafts, after, snap, cfg) {
    var c = constraints(cfg);
    var violations = [], warnings = [];
    var asset = after.total_asset || 0;
    var tradedCodes = {};
    drafts.forEach(function (d) {
      if ((d.delta_shares || 0) !== 0) tradedCodes[d.code] = true;
    });
    var maxSingle = cNum(c, 'max_single_weight_pct', 25);
    var maxCat = cNum(c, 'max_category_weight_pct', 60);
    if (asset > 0) {
      drafts.forEach(function (d) {
        var shares = d.target_shares;
        if (!shares || !d.price) return;
        var w = shares * d.price / asset * 100;
        if (w > maxSingle + 1e-9) {
          var msg = d.code + ' 执行后单只权重 ' + pct2(w) +
            '% 超过上限 ' + pct2(maxSingle) + '%';
          (tradedCodes[d.code] ? violations : warnings).push(msg);
        }
      });
      var tradedCats = {};
      drafts.forEach(function (d) {
        if (tradedCodes[d.code]) tradedCats[d.category || '未分类'] = true;
      });
      Object.keys(after.category_pct || {}).forEach(function (k) {
        var v = after.category_pct[k];
        if (v !== null && v !== undefined && v > maxCat + 1e-9) {
          var msg = '类别「' + k + '」执行后 ' + pct2(v) +
            '% 超过上限 ' + pct2(maxCat) + '%';
          (tradedCats[k] ? violations : warnings).push(msg);
        }
      });
    }
    var maxLegs = Math.floor(cNum(c, 'max_legs', 8));
    if ((after.legs || 0) > maxLegs) {
      var lm = '执行后持仓腿数 ' + after.legs + ' 超过上限 ' + maxLegs;
      if (Object.keys(tradedCodes).length) violations.push(lm);
      else warnings.push(lm);
    }
    if (after.cash_pct !== null && after.cash_pct !== undefined &&
        after.cash_pct < cNum(c, 'min_cash_pct', 5) - 1e-9) {
      violations.push('执行后现金 ' + pct2(after.cash_pct) + '% 低于下限 ' +
        pct2(cNum(c, 'min_cash_pct', 5)) + '%');
    }
    drafts.forEach(function (d) {
      if ((d.delta_shares || 0) < 0 &&
          Math.abs(d.delta_shares) > (d.current_shares || 0)) {
        violations.push(d.code + ' 卖出份额 ' + Math.abs(d.delta_shares) +
          ' 超过持有 ' + d.current_shares);
      }
    });
    if (snap.unclassified && snap.unclassified.length) {
      warnings.push('以下持仓未能自动分类，结构核对不完整：' +
        snap.unclassified.join('、') + '（可在持仓设置里手动指定类别）');
    }
    return { violations: violations, warnings: warnings };
  }

  function unclassifiedOf(snap, legs) {
    var out = [];
    if (snap.unclassified) {
      snap.unclassified.forEach(function (c) { out.push(String(c)); });
    } else {
      (snap.rows || []).forEach(function (r) {
        if (!r.category || r.category === '未分类') out.push(String(r.code));
      });
    }
    (legs || []).forEach(function (l) {
      if ((!l.category || l.category === '未分类') &&
          out.indexOf(String(l.code)) < 0) out.push(String(l.code));
    });
    return out;
  }

  /* 分层：价格 → 技术面 → 分类 → 可执行决策。 */
  function buildLayers(legs, snap) {
    var price = !!snap.complete;
    var technical = true;
    (legs || []).forEach(function (l) {
      var a = l.action || 'ABSTAIN';
      if (a === 'ABSTAIN' || a === 'DEMO') technical = false;
      if (l.last === null || l.last === undefined) technical = false;
    });
    var unc = unclassifiedOf(snap, legs);
    var classification = unc.length === 0;
    var regimeOk = true;
    if (snap.regime) {
      regimeOk = snap.regime.lo !== null && snap.regime.lo !== undefined &&
                 snap.regime.hi !== null && snap.regime.hi !== undefined;
    } else if (snap.regime_available !== undefined) {
      regimeOk = !!snap.regime_available;
    }
    return {
      price: price,
      technical: technical,
      classification: classification,
      decision: price && technical && classification && regimeOk
    };
  }

  function plan(legs, snap, cfg) {
    legs = legs || [];
    snap = snap || {};
    cfg = cfg || {};
    var c = constraints(cfg);
    var lot = Math.floor(cNum(c, 'lot_size', 100));
    var layers = buildLayers(legs, snap);
    var meta = { contract_version: '1.0', mode: 'browser' };
    var violations = [], warnings = [];

    if (!snap.complete) {
      violations.push('组合快照不完整：缺价标的 ' +
        ((snap.missing || []).join('、')) + '，禁止生成目标份额');
      return {
        meta: meta, decisions: [], orders: [], portfolio_after: null,
        violations: violations, warnings: warnings, ok: false,
        layers: layers, audit: { stale_signal: false }
      };
    }

    var rowsByCode = {};
    (snap.rows || []).forEach(function (r) { rowsByCode[String(r.code)] = r; });
    var totalAsset = num(snap.total_asset) || 0;
    var drafts = [];

    legs.forEach(function (l) {
      var code = String(l.code);
      var row = rowsByCode[code] || {};
      var d = desired(l, row, cfg, totalAsset, lot);
      d.category = row.category || l.category || '未分类';
      d.bucket = row.bucket || l.bucket || '未分类';
      d.name = l.name === undefined || l.name === null ? code : l.name;
      d.reason_ids = l.rule_ids || [];
      drafts.push(d);
    });

    var cash = settle(drafts, snap, cfg);
    var after = portfolioAfter(drafts, cash, cfg);
    var checked = validateAfter(drafts, after, snap, cfg);
    checked.violations.forEach(function (v) { violations.push(v); });
    checked.warnings.forEach(function (w) { warnings.push(w); });

    /* 与 Python 一致：综合分析不可用（价格/技术面/分类任意一层缺失）只降级，
       不发布任何目标份额。 */
    if (!layers.decision) {
      ((layers.reasons && layers.reasons.decision) || ['综合分析不可用'])
        .forEach(function (r) { if (violations.indexOf(r) < 0) violations.push(r); });
    }

    var ok = violations.length === 0;
    var decisions = drafts.map(function (d) {
      var trading = inList(TRADING_ACTIONS, d.action);
      var published = ok && trading && (d.delta_shares || 0) !== 0;
      var blocked = d.blocked_by.slice();
      if (!ok) blocked = blocked.concat(violations);
      return {
        code: d.code,
        name: d.name,
        action: d.action,
        current_weight: d.current_weight,
        target_weight: (ok && trading) ? d.target_weight : null,
        draft_target_weight: d.target_weight,
        current_shares: d.current_shares,
        target_shares: (ok && trading) ? d.target_shares : null,
        draft_target_shares: d.target_shares,
        delta_shares: d.delta_shares,
        price: d.price,
        notional: d.notional,
        fee: d.fee,
        reason_ids: d.reason_ids,
        constraints_applied: d.applied,
        funding_source: d.funded_by,
        published: published,
        blocked_by: blocked
      };
    });

    if (!ok) {
      after.diagnostic = true;
      after.published = false;
    }
    var orders = decisions.filter(function (d) { return d.published; });
    return {
      meta: meta,
      decisions: decisions,
      orders: orders,
      portfolio_after: after,
      violations: violations,
      warnings: warnings,
      ok: ok,
      layers: layers,
      audit: { stale_signal: false }
    };
  }

  /* 候选五态：与 Python opportunities.evaluate 同语义（数据 → 规则方向 → 组合门禁） */
  function evaluateCandidates(cands, snap, cfg, pdec) {
    var c = (cfg && cfg.constraints) || {};
    var ex = (cfg && cfg.execution) || {};
    var after = (pdec && pdec.portfolio_after) || {};
    var cashPct = after.cash_pct != null ? after.cash_pct
      : (snap && snap.cash_pct != null ? snap.cash_pct : null);
    var legs = after.legs != null ? after.legs
      : ((snap && snap.rows) || []).length;
    var target = Number(ex.initiate_target_pct != null ? ex.initiate_target_pct : 5);
    var decisionReady = !!(pdec && pdec.layers && pdec.layers.decision);

    return (cands || []).map(function (x) {
      var out = {
        code: String(x.code), name: x.name || String(x.code),
        category: x.category || '未分类',
        level: x.level || '—', price: x.price || '—', rule: x.rule || '',
        state: 'WATCH', reason: '', target_weight: null
      };
      var st = x.data_status || 'OK';
      var act = x.action || 'ADD';
      if (st === 'ABSTAIN' || st === 'DEMO') {
        out.state = 'ABSTAIN'; out.reason = '数据不足或为演示数据'; return out;
      }
      if (act === 'CLEAR' || act === 'TRIM' || act === 'EXIT') {
        out.state = 'AVOID'; out.reason = '规则方向为退出/减仓'; return out;
      }
      if (out.category === '未分类') {
        out.state = 'WATCH'; out.reason = '分类未知，先补齐分类与跟踪指数'; return out;
      }
      if (!decisionReady) {
        out.state = 'ABSTAIN'; out.reason = '综合分析不可用（数据或仓位区间缺失）'; return out;
      }
      if (legs >= Number(c.max_legs != null ? c.max_legs : 99)) {
        out.state = 'AVOID'; out.reason = '执行后腿数已达上限'; return out;
      }
      if (cashPct != null &&
          cashPct < Number(c.min_cash_pct != null ? c.min_cash_pct : 0) + target) {
        out.state = 'WAIT_CONFIRMATION';
        out.reason = '现金不足以在保留缓冲后建仓'; return out;
      }
      var catPct = (after.category_pct || {})[out.category];
      if (catPct != null &&
          catPct + target > Number(c.max_category_weight_pct != null
            ? c.max_category_weight_pct : 100)) {
        out.state = 'AVOID'; out.reason = '该类别已接近权重上限'; return out;
      }
      out.state = 'READY';
      out.target_weight = target;
      out.reason = '通过数据与组合门禁（研究性方案，不生成订单）';
      return out;
    });
  }

  root.WB_DECISION = {
    buildPortfolioDecision: function (input) {
      input = input || {};
      return plan(input.legs, input.snap, input.cfg);
    },
    plan: plan,
    targetWeight: targetWeight,
    lotFloor: lotFloor,
    computeFee: computeFee,
    settle: settle,
    portfolioAfter: portfolioAfter,
    validateAfter: validateAfter,
    buildLayers: buildLayers,
    evaluateCandidates: evaluateCandidates
  };
})(typeof window !== 'undefined' ? window : this);

  }
}

function bjNow(){

  return d.getUTCFullYear()+'-'+p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+' '+
         p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds());

function qTxt(y,mo,d,h,mi,s){

/* ---------------- 手动刷新行情（免费接口 · JSONP） ---------------- */
function tSym(code){ return (code[0]==='5'||code[0]==='6'||code[0]==='9'?'sh':'sz')+code; }
function applyQuote(code,last,prev,name){
  var chg=(isFinite(prev)&&prev>0)?Math.round((last/prev-1)*10000)/100:null;
  code=String(code);
  PQ[code]={last:last,prev:prev,chg:chg};   /* 持仓里可能有观察池之外的标的 */
  if(name&&name!==code) QNAME[code]=String(name).trim();
  (D.legs||[]).forEach(function(l){
    if(String(l.code)===code){
      /* 只更新最新价与涨跌幅；日频动作/价位不因盘中价重算。
         首次刷新时冻结收盘价，供 legFeat 继续按收盘口径求值。 */
      if(l.signal_last==null){ l.signal_last=l.last; l.signal_change=l.change; }
      l.last=last;
      if(chg!=null) l.change=chg;
    }
  });
  SIGNAL_STALE=true;
  if(PDEC){ PDEC.audit=PDEC.audit||{}; PDEC.audit.stale_signal=true; }
}
function loadScript(url, charset, cb){
  var s=document.createElement('script');
  if(charset) s.charset=charset;
  var done=false;
  function fin(ok){ if(done) return; done=true; if(s.parentNode) s.remove(); cb(ok); }
  s.onload=function(){ fin(true); };
  s.onerror=function(){ fin(false); };
  s.src=url; document.head.appendChild(s);
  setTimeout(function(){ fin(false); },9000);
}
/* 腾讯：v_sh510300="1~沪深300ETF~510300~4.05~4.03~…~20261112161450~…"
   idx3 最新 · idx4 昨收 · idx30 行情时间 yyyymmddHHMMSS */
function parseTencent(syms){
  var got=0, stamp='';
  syms.forEach(function(sym){
    var raw=window['v_'+sym];
    if(typeof raw!=='string') return;
    var a=raw.split('~');
    if(a.length<38) return;
    var last=parseFloat(a[3]);
    if(!isFinite(last)||last<=0) return;
    got++; applyQuote(String(a[2]).slice(-6), last, parseFloat(a[4]), a[1]);
    var t=String(a[30]||'');
    if(t.length===14 && t>stamp) stamp=t;
  });
  if(stamp) D.meta.quote_at=qTxt(stamp.slice(0,4),+stamp.slice(4,6),+stamp.slice(6,8),
                                 +stamp.slice(8,10),+stamp.slice(10,12),+stamp.slice(12,14));
  return got;
}
/* 新浪：var hq_str_sh510300="沪深300ETF,4.030,4.050,...,2026-11-12,15:00:00,00" */
function parseSina(syms){
  var got=0, stamp='';
  syms.forEach(function(sym){
    var raw=window['hq_str_'+sym];
    if(typeof raw!=='string') return;
    var a=raw.split(',');
    if(a.length<6) return;
    var last=parseFloat(a[3]), prev=parseFloat(a[2]);
    if(!isFinite(last)||last<=0) return;
    got++; applyQuote(sym.slice(-6), last, prev, a[0]);
    if(a[30] && a[31] && a[30].length===10){
      var t=a[30]+' '+a[31];
      if(t>stamp) stamp=t;
    }
  });
  if(stamp) D.meta.quote_at=stamp;
  return got;
}
function refreshQuotes(){
  var codes=(D.legs||[]).map(function(l){ return String(l.code); })
    .concat((HOLD.rows||[]).map(function(r){ return String(r.code); }))
    .filter(function(c,i,a){ return /^\d{6}$/.test(c)&&a.indexOf(c)===i; });
  if(!codes.length){ flash('没有可刷新的 ETF', true); return; }
  var btn=document.getElementById('btnRefresh');
  if(btn){ btn.disabled=true; btn.textContent='刷新中…'; }
  var syms=codes.map(tSym);

  function finish(got){
    if(btn){ btn.disabled=false; btn.textContent='刷新行情'; }
    if(!got){
      flash('刷新失败：免费行情接口暂不可用（腾讯 / 新浪均无响应），页面保留上次数据', true);
      return;
    }
    var ts=nowStr();
    D.meta.refreshed=true;
    render();
    var q=D.meta.quote_at;
    flash('已刷新 '+got+' 只最新价 · '+(q||ts));
  }
  loadScript('https://qt.gtimg.cn/q='+syms.join(','), 'gbk', function(ok){
    var got=ok?parseTencent(syms):0;
    if(got){ finish(got); return; }
    loadScript('https://hq.sinajs.cn/list='+syms.join(','), 'gbk', function(ok2){
      finish(ok2?parseSina(syms):0);
    });
  });
}

/* ---------------- 持仓：云端密文 + 本机解密 ----------------
   仓库里只有 positions.enc.json 密文（AES-GCM + PBKDF2），口令不上传；
   解锁后在本机浏览器解密、计算，明文不落盘。 */
function legOf(code){
  var a=D.legs||[];
  for(var i=0;i<a.length;i++) if(String(a[i].code)===String(code)) return a[i];
  return null;
}
function priceOf(code){
  var q=PQ[String(code)];
  if(q) return q;
  var l=legOf(code);
  if(l&&n(l.last)>0) return {last:n(l.last),prev:null,chg:l.change};
  return null;
}
function draftReset(){
  EDIT=(HOLD.rows||[]).map(function(r){ return Object.assign({},r); });
  (EDIT||[]).forEach(function(r){
    var c=String(r.code||''), nm=String(r.name||'').trim();
    if((!nm||nm===c)&&QNAME[c]) r.name=QNAME[c];
  });
  CASH_EDIT=n(HOLD.cash);
}
function calcPort(){
  var rows=[],totalPos=0,dayPnl=0,hasDay=false,costBasis=0,sumPnl=0,missing=[];
  (HOLD.rows||[]).forEach(function(r){
    var q=priceOf(r.code);
    var shares=n(r.shares),cost=n(r.cost),last=(q&&n(q.last)>0)?n(q.last):null;
    if(last==null) missing.push(String(r.code));
    var mv=(last!=null)?last*shares:null;
    var pnl=(last!=null&&cost>0)?(last-cost)*shares:null;
    var day=null;
    if(q&&last!=null){
      if(n(q.prev)>0) day=(last-n(q.prev))*shares;
      else if(q.chg!=null&&isFinite(q.chg)) day=shares*(last-last/(1+n(q.chg)/100));
    }
    if(day!=null){ dayPnl+=day; hasDay=true; }
    if(mv!=null) totalPos+=mv;
    if(cost>0&&shares>0) costBasis+=cost*shares;
    if(pnl!=null) sumPnl+=pnl;
    rows.push({code:String(r.code),name:nameOfRow(r),category:catOfRow(r),
      shares:shares,cost:cost,last:last,mv:mv,pnl:pnl,
      pnl_pct:(last!=null&&cost>0)?(last/cost-1)*100:null,
      day:day,priced:last!=null,settle:r.settle||'T+1',leg:legOf(r.code)});
  });
  var complete=missing.length===0;
  var totalAsset=complete?totalPos+n(HOLD.cash):null;
  rows.forEach(function(x){
    x.weight=(complete&&totalAsset>0&&x.mv!=null)?x.mv/totalAsset*100:null;
  });
  return {rows:rows,totalPos:complete?totalPos:null,totalAsset:totalAsset,
          complete:complete,missing:missing,
          cash:n(HOLD.cash),
          positionPct:(complete&&totalAsset>0)?totalPos/totalAsset*100:null,
          cashPct:(complete&&totalAsset>0)?n(HOLD.cash)/totalAsset*100:null,
          pnl:complete?sumPnl:null,
          pnlPct:(complete&&costBasis>0)?sumPnl/costBasis*100:null,
          dayPnl:(complete&&hasDay)?dayPnl:null};
}
/* 四项分开仪表（数据质量 / 集中度 / 趋势 / 风险），不再合成单一分数 */
function dashboardOf(p){
  var rg=(D.market&&D.market.regime)||{fit_lo:null,fit_hi:null};
  var held=p.rows.map(function(r){ return r.leg; }).filter(Boolean);
  var cat={},legMax=0,hhi=0,invTotal=0;
  p.rows.forEach(function(r){
    if(r.category) cat[r.category]=(cat[r.category]||0)+(r.weight||0);
    if((r.weight||0)>legMax) legMax=r.weight||0;
    if(r.mv!=null) invTotal+=r.mv;
  });
  /* HHI / 有效只数用「占已投资市值」，与后端 risk.nominal 一致；
     否则现金占比高时会出现「3 只持仓、有效只数 4.17」。 */
  p.rows.forEach(function(r){
    if(r.mv!=null&&invTotal>0){ var w=r.mv/invTotal; hhi+=w*w; }
  });
  var levels={A:0,B:0,C:0,D:0};
  held.forEach(function(l){ if(levels[l.level]!=null) levels[l.level]++; });
  var abstain=p.rows.filter(function(r){ return !r.leg; }).map(function(r){ return r.code; });
  return {
    dataQuality:{complete:p.complete,missing:p.missing,abstain:abstain},
    concentration:{maxSingle:legMax,hhi:hhi,effectiveN:hhi>0?1/hhi:null,
      category:cat,catMax:Math.max.apply(null,Object.keys(cat).map(function(k){ return cat[k]; }).concat([0]))},
    trend:{levels:levels,
      belowMa10:held.filter(function(l){ return n(l.below_ma10)>0; }).map(function(l){ return l.code; })},
    regime:rg,positionPct:p.positionPct,lo:rg.fit_lo,hi:rg.fit_hi
  };
}
function ensureHoldQuotes(done){
  /* 缺价要取价；名称缺失（或名称就是代码）也要取，因为自动分类依赖名称 */
  var codes=(HOLD.rows||[]).filter(function(r){
    var c=String(r.code||'');
    if(!/^\d{6}$/.test(c)) return false;
    var nm=String(r.name||'').trim();
    return !priceOf(c) || !nm || nm===c;
  }).map(function(r){ return String(r.code); });
  if(!codes.length){ if(done) done(); return; }
  var syms=codes.map(tSym);
  loadScript('https://qt.gtimg.cn/q='+syms.join(','),'gbk',function(ok){
    if(ok&&parseTencent(syms)){ if(done) done(); return; }
    loadScript('https://hq.sinajs.cn/list='+syms.join(','),'gbk',function(ok2){
      if(ok2) parseSina(syms);
      if(done) done();
    });

}
/* 近 60 日收盘价（腾讯 K 线，JSONP）；失败返回 null，不影响持仓盈亏 */
function fetchKline(code,cb){
  var sym=tSym(code),vn='kq_'+sym;
  var s=document.createElement('script'),done=false;
  function fin(arr){
    if(done) return;
    done=true;
    if(s.parentNode) s.remove();
    try{ delete window[vn]; }catch(e){ window[vn]=undefined; }
    cb(arr||null);
  }
  s.onload=function(){
    var arr=null;
    try{
      var d=window[vn].data[sym];
      arr=d.qfqday||d.day||null;
    }catch(e){}
    fin(arr?arr.map(function(x){ return parseFloat(x[2]); })
               .filter(function(x){ return isFinite(x)&&x>0; }):null);
  };
  s.onerror=function(){ fin(null); };
  s.src='https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param='+sym+',day,,,60,qfq&_var='+vn;
  document.head.appendChild(s);
  setTimeout(function(){ fin(null); },9000);
}
function perfOf(series,p){
  var codes=Object.keys(series).filter(function(c){
    return series[c]&&series[c].length>=20; });
  if(!codes.length) return null;
  var m=Math.min.apply(null,codes.map(function(c){ return series[c].length; }));
  var nav=[],i;
  for(i=0;i<m;i++){
    var v=0;
    codes.forEach(function(c){
      var row=p.rows.filter(function(r){ return r.code===c; })[0];
      if(row) v+=series[c][series[c].length-m+i]*row.shares;
    });
    nav.push(v);
  }
  var rets=[];
  for(i=1;i<nav.length;i++) if(nav[i-1]>0) rets.push(nav[i]/nav[i-1]-1);
  if(!rets.length) return null;
  var mean=rets.reduce(function(a,b){ return a+b; },0)/rets.length;
  var sd=Math.sqrt(rets.reduce(function(a,b){ return a+(b-mean)*(b-mean); },0)/rets.length);
  var peak=nav[0],maxdd=0;
  nav.forEach(function(x){ if(x>peak) peak=x; var dd=(x-peak)/peak*100; if(dd<maxdd) maxdd=dd; });
  var annual=nav[0]>0?Math.pow(nav[nav.length-1]/nav[0],252/(nav.length-1))-1:0;
  return {days:nav.length,annual:annual*100,
          sharpe:sd>0?mean/sd*Math.sqrt(252):0,
          calmar:maxdd<0?annual*100/Math.abs(maxdd):0,maxdd:maxdd};
}
function paintPerf(){
  var el=document.getElementById('perfBox');
  if(!el) return;
  if(PERF_BUSY){ el.innerHTML='<div class="notice">获取近 60 日收盘价…</div>'; return; }
  if(!PERF){ el.innerHTML='<div class="notice">历史收盘价不可用，绩效留空</div>'; return; }
  el.innerHTML='<div class="chips">'+[
    ['区间',PERF.days+' 个交易日'],
    ['年化收益',sign(PERF.annual)+f2(PERF.annual)+'%'],
    ['夏普',f2(PERF.sharpe)],
    ['卡玛',f2(PERF.calmar)],
    ['最大回撤',f2(PERF.maxdd)+'%']
  ].map(function(k){ return '<span class="chip">'+esc(k[0])+' <b>'+k[1]+'</b></span>'; }).join('')+'</div>';
}
function loadPerf(){
  var el=document.getElementById('perfBox');
  if(!el) return;
  if(PERF||PERF_BUSY){ paintPerf(); return; }
  var rows=(HOLD.rows||[]).filter(function(r){ return n(r.shares)>0&&priceOf(r.code); });
  if(!rows.length){ PERF=null; return; }
  PERF_BUSY=true;
  var series={},pending=rows.length;
  rows.forEach(function(r){
    fetchKline(r.code,function(cl){
      series[String(r.code)]=cl;
      if(--pending===0){
        PERF_BUSY=false;
        PERF=perfOf(series,calcPort());
        paintPerf();
      }
    });
  });
  paintPerf();
}

/* ---------------- p5 持仓分析（唯一决策契约 + 执行后闭环） ----------------
   动作只来自 window.ETF_RULES.decide()（与后端 methodology.decide 同构）；
   目标份额、费用、现金、执行后仓位由 simulate() 计算（与后端 portfolio/execution.py 同构）；
   证据卡：事实 / 比较 / 规则 / 组合含义 / 反证 / 未知项 / 失效条件。 */
function kpi(k,v,d,warn){
  return '<div class="kpi"><div class="k">'+esc(k)+'</div>'+
    '<div class="v'+(warn?' warn':'')+'">'+v+'</div>'+
    '<div class="d">'+esc(d||'')+'</div></div>';
}
function fy(v){ return v==null?'—':'¥'+Math.round(n(v)).toLocaleString(); }
function actText(a){ var A=(D.methodology&&D.methodology.actions)||{}; return A[a]||a; }
function actKind(a){ return (a==='CLEAR'||a==='TRIM'||a==='EXIT')?'sell':
  ((a==='ADD'||a==='INITIATE')?'buy':'hold'); }
function fmtPrice(a){
  if(a.entry==null&&a.stop==null&&a.tp==null) return '—';
  if(a.action==='HOLD'||a.action==='WATCH') return '止损 '+f2(a.stop)+' · 目标 '+f2(a.tp);
  if(a.action==='CLEAR') return '卖出（目标份额 0）· 限价 '+f2(a.entry);
  return (a.side==='sell'?'卖出 ':'买入 ')+f2(a.entry)+' · 止损 '+f2(a.stop)+' · 目标 '+f2(a.tp);
}
function legFeat(l){
  if(!l) return {};
  /* 价位计算必须用未取整的均线：展示字段 ma5/ma10 已按 3 位小数四舍五入，
     直接拿来算回踩价会与后端产生 0.001 的偏差。support 里保留了原始精度。 */
  var sp=l.support||{};
  var ma5=(sp.ma5!=null?sp.ma5:l.ma5), ma10=(sp.ma10!=null?sp.ma10:l.ma10),
      ma20=(sp.ma20!=null?sp.ma20:l.ma20);
  /* 盘中刷新只改展示价（last/change）；求值固定用首次刷新前的收盘口径。 */
  var sigLast=(l.signal_last!=null?l.signal_last:l.last),
      sigChg=(l.signal_last!=null?l.signal_change:l.change);
  return {last:sigLast,ma5:ma5,ma10:ma10,ma20:ma20,change_pct:sigChg,
    stand_back:l.stand_back,days_above_ma5:l.days_above_ma5,below_ma10_2d:l.below_ma10,
    expand:l.expand,shrink:l.shrink,false_breakout:l.false_breakout,
    reduce_think:l.reduce,support:sp,
    premium_pct:(l.premium_available===false)?null:l.premium_pct,
    premium_available:l.premium_available,
    true_breakout:l.true_breakout||false,is_20d_low:l.is_20d_low||false};
}
/* 单腿结果：池内腿用数据包里的判定；池外腿用同一规则引擎本地求值。
   两者都必须经过 ETF_RULES.decide，不允许再出现第二套等级→动作映射。 */
function legResult(l,r,s1){
  if(!l){
    return {status:'ABSTAIN',level:'—',action:'ABSTAIN',action_text:actText('ABSTAIN')||'数据不足',
            side:'buy',entry:null,stop:null,tp:null,rule_ids:[],hits:[],
            blocked_by:['O-4'],unknowns:['缺行情/关键字段'],data_status:'ABSTAIN'};
  }
  var f=legFeat(l);
  var status=(l.data_status&&l.data_status!=='OK')?l.data_status:
             (l.local?'DEGRADED':(l.status||'OK'));
  var dec=ETF_RULES.decide(D,f,status,{
    position_pct:(s1?n(s1.pos):null),regime_hi:(s1?n(s1.hi):null),
    pnl_pct:(r&&r.pnl_pct!=null)?n(r.pnl_pct):null});
  var pr=(l.price&&l.price.entry!=null)?l.price:ETF_RULES.prices(dec.action,f,0.001);
  return {status:dec.status,level:dec.level,action:dec.action,action_text:actText(dec.action),
          side:pr.side,entry:pr.entry,stop:pr.stop,tp:pr.tp,
          price_types:pr.price_types||{},price_note:pr.note,basis:pr.basis||[],
          rule_ids:dec.rule_ids,hits:dec.hits,blocked_by:dec.blocked_by,
          unknowns:dec.unknowns,data_status:status};
}

/* S1 市场定仓（可观测指数状态） */
function s1Position(p){
  var rg=(D.market&&D.market.regime)||{};
  var lo=(rg.fit_lo==null)?null:n(rg.fit_lo),hi=(rg.fit_hi==null)?null:n(rg.fit_hi);
  var pos=(p&&p.positionPct!=null)?n(p.positionPct):null;
  var act='ABSTAIN';
  if(lo!=null&&hi!=null&&pos!=null) act=pos>hi?'REDUCE':(pos<lo?'ADD':'HOLD');
  return {regime:rg.regime||'未知',lo:lo,hi:hi,pos:pos,action:act,
    gap:(pos!=null&&lo!=null&&hi!=null)?Math.round(((act==='REDUCE'?pos-hi:(act==='ADD'?lo-pos:0)))*100)/100:null,
    observations:rg.observations||[]};
}
function posTxt(s1){
  if(s1.action==='ABSTAIN') return '仓位无法计算（数据不足）';
  return s1.action==='REDUCE'?('高于上沿 '+f2(s1.gap)+'pct · 先降仓'):
    (s1.action==='ADD'?('低于下沿 '+f2(s1.gap)+'pct · 可分批补'):'区间内 · 调结构不加总仓');
}

/* 执行后模拟：目标权重 → 目标份额 → 费用 → 执行后仓位/现金/集中度
   （与 src/etfquant/portfolio/execution.py 同构；不含真实成交回报） */
var EXEC={lot:100,minFee:5.0,feeBps:0.5,slipBps:1.0,maxSingle:25,maxCat:60,minCash:5,band:2,
          trimRatio:0.5,addStep:5,maxLegs:8};
function targetWeight(action,curW){
  if(curW==null) return null;
  if(action==='CLEAR') return 0;
  if(action==='TRIM') return Math.round(curW*EXEC.trimRatio*10000)/10000;
  if(action==='ADD') return Math.round(Math.min(curW+EXEC.addStep,EXEC.maxSingle)*10000)/10000;
  return Math.round(curW*10000)/10000;
}
function simulate(p,results){
  var out={rows:[],violations:[],warnings:[],after:null};
  if(!p.complete){
    out.violations.push('组合快照不完整：缺价标的 '+p.missing.join('、')+'，禁止生成目标份额');
    return out;
  }
  var cash=n(p.cash),total=n(p.totalAsset),pos=0,cat={},legs=0,byCode={};
  results.forEach(function(x,i){
    var r=p.rows[i],a=x.a,curW=(r.weight==null)?null:n(r.weight);
    var tw=targetWeight(a.action,curW),price=(r.last!=null)?n(r.last):null;
    var ts=null,delta=null,notional=null,fee=null,applied=[];
    if(tw!=null&&price>0){
      ts=Math.floor(total*tw/100/price/EXEC.lot)*EXEC.lot;
      var curShares=n(r.shares);
      if((a.action==='ADD'||a.action==='TRIM')&&Math.abs(tw-(curW||0))<EXEC.band){
        ts=Math.floor(curShares/EXEC.lot)*EXEC.lot; delta=0;
        applied.push('不换仓带：偏离 '+f2(Math.abs(tw-(curW||0)))+'pct < '+EXEC.band+'pct');
      }else{ delta=ts-curShares; }
      notional=delta*price;
      fee=delta?Math.max(EXEC.minFee,Math.abs(notional)*EXEC.feeBps/10000):0;
      applied.push('按 '+EXEC.lot+' 份取整');
      applied.push('费用 ¥'+f2(fee)+'（最低 ¥'+EXEC.minFee+'，滑点 '+EXEC.slipBps+'bp）');
      if(delta<0){
        if(Math.abs(delta)>curShares) out.violations.push(r.code+' 卖出份额超过持有');
        cash+=Math.abs(delta)*price*(1-EXEC.slipBps/10000)-fee;
      }else if(delta>0){
        cash-=Math.abs(delta)*price*(1+EXEC.slipBps/10000)+fee;
        if(cash<0) out.violations.push(r.code+' 买入现金不足');
      }
    }else{ applied.push('缺少价格或权重，未生成份额'); }
    byCode[r.code]={price:price,shares:(ts!=null?ts:n(r.shares)),category:r.category};
    var row={code:r.code,name:r.name,action:a.action,curW:curW,targetW:tw,
      curShares:n(r.shares),targetShares:ts,delta:delta,price:price,
      notional:notional,fee:fee,applied:applied,rule_ids:a.rule_ids};
    out.rows.push(row);
  });
  Object.keys(byCode).forEach(function(c){
    var s=byCode[c]; if(s.price==null||s.shares==null) return;
    var mv=s.price*s.shares; pos+=mv; legs+=(s.shares>0?1:0);
    cat[s.category]=(cat[s.category]||0)+mv;
  });
  var asset=pos+cash;
  var catPct={};
  Object.keys(cat).forEach(function(k){ catPct[k]=asset>0?cat[k]/asset*100:null; });
  out.after={total:asset,cash:cash,pos:pos,
    positionPct:asset>0?pos/asset*100:null,
    cashPct:asset>0?cash/asset*100:null,catPct:catPct,legs:legs,filled:false};
  if(asset>0&&out.after.cashPct<EXEC.minCash-1e-9)
    out.violations.push('执行后现金 '+f2(out.after.cashPct)+'% 低于下限 '+EXEC.minCash+'%');
  out.rows.forEach(function(r){
    if(r.targetW!=null&&r.targetW>EXEC.maxSingle+1e-9)
      out.violations.push(r.code+' 目标权重 '+f2(r.targetW)+'% 超单只上限');
  });
  Object.keys(catPct).forEach(function(k){
    if(catPct[k]!=null&&catPct[k]>EXEC.maxCat+1e-9)
      out.violations.push('类别「'+k+'」执行后 '+f2(catPct[k])+'% 超上限');
  });
  if(legs>EXEC.maxLegs) out.violations.push('执行后腿数 '+legs+' 超上限 '+EXEC.maxLegs);
  return out;
}

function rows5adv(p,s1){
  var rows=[];
  p.rows.forEach(function(r){
    var l=r.leg||localLeg(r.code,r);
    rows.push({a:legResult(l,r,s1),code:r.code,name:r.name,
               w:r.weight,l:l,r:r});
  });
  var held={};
  p.rows.forEach(function(r){ held[r.code]=1; });
  var adds=[];
  if(s1.action!=='REDUCE'&&s1.action!=='ABSTAIN'){
    (D.legs||[]).forEach(function(l){
      if(held[String(l.code)]) return;
      if(l.level!=='A'&&l.level!=='B') return;
      var pr=l.price&&l.price.entry!=null?l.price:null;
      if(!pr||pr.side!=='buy') return;
      adds.push({code:l.code,name:l.name,level:l.level,
        price:fmtPrice({action:'ADD',side:'buy',entry:pr.entry,stop:pr.stop,tp:pr.tp}),
        rule:(l.rule_ids||[]).join(' / ')||('规则 '+l.level)});
    });
  }
  return {rows:rows,adds:adds};
}

function hasPrefix(c,ps){ for(var i=0;i<ps.length;i++) if(c.indexOf(ps[i])===0) return true; return false; }
/* 返回 [类别, 依据] */
function classifyCat(code,name){
  var c=String(code||'').trim(), nm=String(name||'').trim();
  if(!nm||nm===c) nm=QNAME[c]||'';
  var i,j,k;
  if(nm&&nm!==c){
    for(i=0;i<CAT_NAME_RULES.length;i++){
      k=CAT_NAME_RULES[i][1];
      for(j=0;j<k.length;j++) if(nm.indexOf(k[j])>=0) return [CAT_NAME_RULES[i][0],'名称关键词「'+k[j]+'」'];
    }
  }
  for(i=0;i<CAT_CODE_RULES.length;i++) if(hasPrefix(c,CAT_CODE_RULES[i][0])) return [CAT_CODE_RULES[i][1],'代码段'];
  if(CAT_BROAD[c]) return ['宽基','常见宽基代码'];
  return ['未分类','无匹配规则'];
}
function nameOfRow(r){
  var nm=String((r&&r.name)||'').trim(), c=String((r&&r.code)||'');
  return (nm&&nm!==c)?nm:(QNAME[c]||nm||c);
}
/* 已声明类别优先；留空或写「未分类」都按自动识别处理 */
function catOfRow(r){
  var d=String((r&&r.category)||'').trim();
  if(d&&d!=='未分类') return d;
  return classifyCat(r&&r.code,nameOfRow(r))[0];
}
function sigLastOf(x){
  var l=x&&x.l;
  if(l){
    if(l.signal_last!=null) return n(l.signal_last);
    if(l.last!=null) return n(l.last);
  }
  return (x&&x.r&&x.r.last!=null)?n(x.r.last):null;
}
function legacyPdec(p,s1,adv){
  var sim=simulate(p,adv.rows);
  var trading=['INITIATE','ADD','TRIM','EXIT','CLEAR'];
  var decisions=sim.rows.map(function(r){
    var isTrade=trading.indexOf(r.action)>=0;
    return {code:r.code,name:r.name,action:r.action,
      current_weight:r.curW,target_weight:r.targetW,draft_target_weight:r.targetW,
      current_shares:r.curShares,target_shares:r.targetShares,
      draft_target_shares:r.targetShares,delta_shares:r.delta,
      price:r.price,notional:r.notional,fee:r.fee,reason_ids:r.rule_ids||[],
      constraints_applied:r.applied||[],funding_source:null,
      published:!!(isTrade&&r.delta&&!sim.violations.length),
      blocked_by:sim.violations.slice()};
  });
  var after=sim.after?{
    total_asset:sim.after.total,cash:sim.after.cash,market_value:sim.after.pos,
    position_pct:sim.after.positionPct,cash_pct:sim.after.cashPct,
    risk_position_pct:null,max_single_pct:null,hhi:null,effective_n:null,
    category_pct:sim.after.catPct,bucket_pct:{},legs:sim.after.legs,
    filled:false,diagnostic:sim.violations.length>0
  }:null;
  return {meta:{contract_version:'0',mode:'legacy'},decisions:decisions,
    orders:decisions.filter(function(d){ return d.published; }),
    portfolio_after:after,violations:sim.violations,warnings:[],
    ok:!sim.violations.length,
    layers:{price:!!p.complete,technical:false,classification:false,decision:false},
    audit:{stale_signal:SIGNAL_STALE,legacy:true}};
}
function buildPdec(p,s1,adv){
  p=p||calcPort(); s1=s1||s1Position(p); adv=adv||rows5adv(p,s1);
  if(!window.WB_DECISION||!D||!D.contract){ return legacyPdec(p,s1,adv); }

  var byCode={};
  adv.rows.forEach(function(x){ byCode[String(x.code)]=x; });
  var complete=!!p.complete, missing=[], sigPos=0;
  p.missing.forEach(function(c){ missing.push(String(c)); });
  var rows=p.rows.map(function(r){
    var x=byCode[String(r.code)]||{r:r};
    var last=sigLastOf(x);
    if(last==null&&missing.indexOf(String(r.code))<0) missing.push(String(r.code));
    if(last!=null) sigPos+=last*n(r.shares); else complete=false;
    return {code:String(r.code),name:nameOfRow(r),category:catOfRow(r),
      bucket:bucketOf(catOfRow(r)),shares:n(r.shares),cost:n(r.cost),
      last:last,weight:null};
  });
  var total=complete?sigPos+n(p.cash):null;
  rows.forEach(function(r){
    r.weight=(complete&&total>0)?r.last*r.shares/total*100:null;
  });
  var legs=adv.rows.map(function(x){
    return {code:String(x.code),name:nameOfRow(x.r||x),
      category:catOfRow(x.r||x),bucket:bucketOf(catOfRow(x.r||x)),
      action:(x.a&&x.a.action)||'ABSTAIN',last:sigLastOf(x),
      rule_ids:(x.a&&x.a.rule_ids)||[]};
  });
  var unclassified=rows.filter(function(r){
    return r.category==='未分类'||r.bucket==='未分类';
  }).map(function(r){ return r.code; });
  var snap={complete:complete,cash:n(p.cash),total_asset:total,rows:rows,
    missing:missing,unclassified:unclassified,
    regime:{lo:s1.lo,hi:s1.hi}};

  var out=null;
  try{ out=window.WB_DECISION.buildPortfolioDecision({legs:legs,snap:snap,cfg:D.contract}); }
  catch(e){ return legacyPdec(p,s1,adv); }
  if(!out||!out.decisions) return legacyPdec(p,s1,adv);
  out.audit=out.audit||{};
  out.audit.stale_signal=SIGNAL_STALE;
  out.audit.signal_date=(D.meta&&(D.meta.data_date||D.meta.as_of))||null;
  return out;
}

function observePortfolioSections(){
  var root=document.querySelector('.content'), sections=document.querySelectorAll('.portfolio-section');
  if(!root||!sections.length||!window.IntersectionObserver) return;
  if(window.PORTFOLIO_OBSERVER) window.PORTFOLIO_OBSERVER.disconnect();

function maOf(a,k){
  if(!a||a.length<k) return null;
  var s=0;
  for(var i=a.length-k;i<a.length;i++){ if(!isFinite(a[i])) return null; s+=a[i]; }
  return s/k;
}
function maSeries(a,k){
  var out=new Array(a.length).fill(null),s=0,i;
  for(i=0;i<a.length;i++){ s+=a[i]; if(i>=k) s-=a[i-k]; if(i>=k-1) out[i]=s/k; }
  return out;
}
/* 池外 K 线质量门禁：排序、去重、OHLC 关系、未收盘剔除、陈旧判断。
   任一关键项失败返回 null，调用方按「数据不足」处理，不得继续驱动动作。 */
function pad2(x){ return (x<10?'0':'')+x; }
function sanitizeBars(b){
  if(!b||!b.closes||!b.closes.length||!b.highs||!b.lows) return null;
  var n=b.closes.length,rows=[],i;
  var now=new Date();
  var today=now.getFullYear()+'-'+pad2(now.getMonth()+1)+'-'+pad2(now.getDate());
  var closed=(now.getHours()*60+now.getMinutes())>=15*60;
  for(i=0;i<n;i++){
    var d=b.dates?String(b.dates[i]||''):'';
    var c=+b.closes[i],o=+b.opens[i],h=+b.highs[i],l=+b.lows[i],v=+b.vols[i];
    if(!isFinite(c)||c<=0) continue;
    if(!isFinite(o)||o<=0) o=c;
    if(!isFinite(h)||h<=0) h=Math.max(o,c);
    if(!isFinite(l)||l<=0) l=Math.min(o,c);
    if(h<Math.max(o,c)-1e-9||l>Math.min(o,c)+1e-9) continue;
    if(!isFinite(v)||v<0) v=0;
    if(d&&d===today&&!closed) continue;   /* 未收盘 K 线不进入日频信号 */
    rows.push({d:d,o:o,c:c,h:h,l:l,v:v});
  }
  if(rows.length<20) return null;
  if(rows[0].d){
    rows.sort(function(x,y){ return x.d<y.d?-1:(x.d>y.d?1:0); });
    var uniq=[];
    rows.forEach(function(r){
      if(uniq.length&&uniq[uniq.length-1].d===r.d) uniq[uniq.length-1]=r;
      else uniq.push(r);
    });
    rows=uniq;
    var last=rows[rows.length-1].d;
    var ld=new Date(last+'T00:00:00');
    if(!isNaN(ld.getTime())&&(now-ld)/86400000>15) return null;  /* 陈旧 */
    if(rows.length<20) return null;
  }
  return {dates:rows.map(function(r){ return r.d; }),
          opens:rows.map(function(r){ return r.o; }),
          closes:rows.map(function(r){ return r.c; }),
          highs:rows.map(function(r){ return r.h; }),
          lows:rows.map(function(r){ return r.l; }),
          vols:rows.map(function(r){ return r.v; })};

/* 与 features.frame 同口径：量比用前 5 日均量；上影线取倒数第三根；假突破=放量+下跌+破MA20 */
function calcBars(b){
  b=sanitizeBars(b);
  if(!b) return null;
  var c=b.closes.filter(function(x){ return isFinite(x)&&x>0; });
  if(c.length<20) return null;
  var off=b.closes.length-c.length;
  var o=(b.opens||[]).slice(off),h=b.highs.slice(off),l=b.lows.slice(off),v=b.vols.slice(off);
  var i,n=c.length;
  var last=c[n-1],prev=c[n-2];
  var ma5=maOf(c,5),ma10=maOf(c,10),ma20=maOf(c,20),ma60=maOf(c,60),ma120=maOf(c,120);
  var ma5s=maSeries(c,5),ma10s=maSeries(c,10);
  var h20=Math.max.apply(null,h.slice(-20)),l20=Math.min.apply(null,l.slice(-20));
  var v5=v.slice(-6,-1),avg5=v5.length?v5.reduce(function(a,x){ return a+x; },0)/v5.length:0;
  var vr=avg5>0?v[n-1]/avg5:null;
  var expand=vr!=null&&vr>=1.3,shrink=vr!=null&&vr<=0.8;
  var days=0;
  for(i=n-1;i>=0;i--){ if(ma5s[i]!=null&&c[i]>ma5s[i]) days++; else break; }
  var below10=0;
  for(i=n-1;i>=0;i--){ if(ma10s[i]!=null&&c[i]<ma10s[i]) below10++; else break; }
  var chg=prev>0?(last/prev-1)*100:0;
  var lowerShadow=(Math.min(o[n-1],last)-l[n-1])/last;
  var c8=c[n-8],c2=c[n-2],c3=c[n-3];
  var t1=(ma10!=null&&last>ma10)&&(last>l20*0.995);
  var t2=shrink;
  var t3=c8&&c8>0&&last>c8&&(last/c8-1)>0.01&&c3>0&&(c2/c3-1)>-0.02;
  var t4=lowerShadow>0.004||last>=o[n-1]||(l[n-1]>=l[n-2]*0.998);
  var tCnt=(t1?1:0)+(t2?1:0)+(t3?1:0)+(t4?1:0);
  var upper=(n>=3&&c[n-3]>0)?
    (h[n-3]-Math.max(o[n-3],c[n-3]))/c[n-3]*100:0;
  var falseOut=!!expand&&last<prev&&ma20!=null&&last<ma20;
  var pos20=(h20>l20)?(last-l20)/(h20-l20):null;
  var isLow=l20!=null&&last<=l20;
  return {last:last,change:chg,
    ma5:ma5,ma10:ma10,ma20:ma20,ma60:ma60,ma120:ma120,
    days_above_ma5:days,below_ma10:below10,
    stand_back:ma5!=null&&last>ma5,
    five:(ma5!=null&&last>=ma5)?(days>=3?'站上MA5第'+days+'日':'站回MA5 · '+days+'日'):'未站回MA5',
    ma_state:(ma5&&ma10&&ma20)?(ma5>ma10&&ma10>ma20?'多头排列':
              (ma5<ma10&&ma10<ma20?'空头排列':'均线纠缠')):'—',
    vol:(expand?'放量':(shrink?'缩量':'平量')),vol_ratio:vr,expand:expand,shrink:shrink,
    false_breakout:falseOut,
    true_breakout:tCnt===4,true_cnt:tCnt,
    is_20d_low:isLow,
    breakout:isLow?'20日新低':(pos20!=null&&pos20>0.8?'接近20日高':
             (pos20!=null&&pos20<0.2?'接近20日低':'区间中部')),
    support:{ma5:ma5,ma10:ma10,ma20:ma20,low20:l20,prev_low:Math.min.apply(null,l.slice(-6,-1))},
    reduce_think:{high20:h20,upper_shadow_pct:isFinite(upper)?upper:0},
    cycle:(ma20&&ma60)?(below10>=2&&last<ma20?'下行趋势':
          ((ma5&&ma10&&ma20&&last>=ma20&&ma20>=ma60)?'上行段':'震荡段')):'未知',
    premium_available:false,premium_pct:null,premium:'数据不可用'};
}
function localLeg(code,row){
  var b=LBARS[code];
  if(!b) return null;
  var k=calcBars(b);
  if(!k) return null;
  row=row||(HOLD.rows||[]).filter(function(x){ return String(x.code)===String(code); })[0]||{};
  return {code:String(code),name:nameOfRow(row),category:catOfRow(row),
    level:null,local:true,data_status:'DEGRADED',status:'DEGRADED',
    last:k.last,change:k.change,five:k.five,ma_state:k.ma_state,
    ma5:k.ma5,ma10:k.ma10,ma20:k.ma20,ma60:k.ma60,ma120:k.ma120,

}

function draftCalc(){
  var rows=[],totalPos=0,costBasis=0,sumPnl=0;
  (EDIT||[]).forEach(function(r){
    var q=priceOf(r.code),last=q?n(q.last):0,sh=n(r.shares),co=n(r.cost);
    var mv=last*sh,pnl=(last>0&&co>0)?(last-co)*sh:0;
    totalPos+=mv; costBasis+=co*sh; sumPnl+=pnl;
    rows.push({mv:mv,pnl:pnl,pct:(last>0&&co>0)?(last/co-1)*100:null,last:last});
  });
  var totalAsset=totalPos+n(CASH_EDIT);
  rows.forEach(function(x){ x.weight=totalAsset>0?x.mv/totalAsset*100:0; });
  return {rows:rows,totalPos:totalPos,totalAsset:totalAsset,sumPnl:sumPnl,
          pnlPct:costBasis>0?sumPnl/costBasis*100:null,
          positionPct:totalAsset>0?totalPos/totalAsset*100:0};
}

/* RFC4180 CSV 解析：支持引号内逗号、换行与双引号转义 */
function parseCsvText(text){
  var s=String(text||''),rows=[],row=[],cur='',q=false,i,ch;
  for(i=0;i<s.length;i++){
    ch=s[i];
    if(q){
      if(ch==='"'){
        if(s[i+1]==='"'){ cur+='"'; i++; } else { q=false; }
      }else cur+=ch;
    }else{
      if(ch==='"') q=true;
      else if(ch===','){ row.push(cur); cur=''; }
      else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(ch==='\r'){ /* 忽略 */ }
      else cur+=ch;
    }
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function validateHoldRows(rows,cash){
  var seen={},errs=[];
  (rows||[]).forEach(function(r){
    if(seen[r.code]) errs.push(r.code+' 重复');
    seen[r.code]=1;
    if(!isFinite(r.shares)||r.shares<0) errs.push(r.code+' 份额非法');
    if(!isFinite(r.cost)||r.cost<0) errs.push(r.code+' 成本非法');
  });
  if(!isFinite(cash)||cash<0) errs.push('现金非法');
  return errs;
}
function importCsv(input){
  var f=input.files&&input.files[0];
  if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    var txt=String(rd.result||'').replace(/^\uFEFF/,'');
    var table=parseCsvText(txt).filter(function(r){
      return r.some(function(x){ return String(x).trim(); });
    });
    if(!table.length){ flash('CSV 是空的',true); return; }
    var head=table[0].map(function(x){ return String(x).trim(); });
    var idx={}; head.forEach(function(h,i){ idx[h]=i; });
    if(idx.code==null||idx.shares==null){ flash('CSV 缺少 code / shares 列',true); return; }
    var rows=[],cash=0;
    table.slice(1).forEach(function(c){
      var o={};
      Object.keys(idx).forEach(function(k){
        o[k]=String(c[idx[k]]==null?'':c[idx[k]]).trim();
      });
      if(!o.code) return;
      if(o.code.toUpperCase()==='CASH'){ cash=n(o.shares); return; }
      rows.push({code:o.code,name:o.name||o.code,category:o.category||'未分类',
                 shares:n(o.shares),cost:n(o.cost),settle:o.settle||'T+1',note:o.note||''});
    });
    var errs=validateHoldRows(rows,cash);
    if(errs.length){ flash('CSV 校验未通过：'+errs.slice(0,3).join('；'),true); return; }
    EDIT=rows; CASH_EDIT=cash;
    HOLD={rows:rows.map(function(r){ return Object.assign({},r); }),cash:cash};

/* 涨跌 → 颜色：A 股习惯「红涨绿跌」，与国际相反，别改 */
function heatColor(v){
  var x=n(v);
  if(x>=5)  return '#a61b1b';
  if(x>=3)  return '#c0392b';
  if(x>=1.5)return '#d95f52';
  if(x>=0.5)return '#e8948c';
  if(x>0)   return '#f0bcb6';
  if(x===0) return '#d8dcd8';
  if(x>-0.5)return '#bfe3cd';
  if(x>-1.5)return '#8ecfaa';
  if(x>-3)  return '#4fae7b';
  if(x>-5)  return '#1c8a52';
  return '#0d6b3c';
}
function inkFor(v){ return Math.abs(n(v))>=1.5?'#fff':'#22303a'; }

/* squarified treemap（Bruls 1999）：面积 = 流通市值，外观对齐 52etf 的板块树图 */
function squarify(items, x, y, w, h, out){
  out = out || [];
  if(!items.length || w <= 0 || h <= 0) return out;
  var total = items.reduce(function(s,d){ return s + d.cap; }, 0);
  if(total <= 0) return out;

  var areas = items.map(function(d){ return d.cap / total * w * h; });
  var side = Math.min(w, h);

  function worst(rowAreas){
    var s = rowAreas.reduce(function(a,b){ return a + b; }, 0);
    if(s <= 0) return Infinity;
    var mx = Math.max.apply(null, rowAreas), mn = Math.min.apply(null, rowAreas);
    return Math.max(side*side*mx/(s*s), (s*s)/(side*side*mn));
  }

  var row = [], rowAreas = [], i = 0;
  while(i < items.length){
    var next = rowAreas.concat([areas[i]]);
    if(!row.length || worst(next) <= worst(rowAreas)){
      row.push(items[i]); rowAreas.push(areas[i]); i++;
    } else break;
  }

  var rowSum = rowAreas.reduce(function(a,b){ return a + b; }, 0);
  var rest = items.slice(row.length);

  if(w >= h){
    var rw = rowSum / h, cy = y;
    row.forEach(function(d, k){
      var dh = rowAreas[k] / rw;
      out.push({it:d, x:x, y:cy, w:rw, h:dh});
      cy += dh;
    });
    return squarify(rest, x + rw, y, w - rw, h, out);
  }
  var rh = rowSum / w, cx = x;
  row.forEach(function(d, k){
    var dw = rowAreas[k] / rh;
    out.push({it:d, x:cx, y:y, w:dw, h:rh});
    cx += dw;
  });
  return squarify(rest, x, y + rh, w, h - rh, out);
}

function heatMap(heat){
  var items = heat.filter(function(d){ return n(d.cap) > 0; })
                  .map(function(d){ return {name:d.name, cap:n(d.cap), chg:n(d.chg), v:n(d.v)}; })
                  .sort(function(a,b){ return b.cap - a.cap; });
  if(!items.length) return box('<div class="note">板块数据暂不可用（市值字段缺失），请重跑脚本。</div>');
  var W = 1000, H = 430;
  var rects = squarify(items, 0, 0, W, H);
  return box('<div class="heatmap">'+rects.map(function(r){
    var s = r.it, c = heatColor(s.chg);
    var tip = s.name+' · 涨跌 '+sign(s.chg)+f2(s.chg)+'% · 成交 '+f2(s.v)+' 亿 · 市值 '+
              Math.round(s.cap).toLocaleString()+' 亿';
    return '<div class="hm" data-name="'+esc(s.name)+'" data-x="'+(r.x/W).toFixed(5)+'" data-y="'+(r.y/H).toFixed(5)+
      '" data-w="'+(r.w/W).toFixed(5)+'" data-h="'+(r.h/H).toFixed(5)+
      '" style="background:'+c+';color:'+inkFor(s.chg)+'" title="'+esc(tip)+
      '" onclick="heatDetail(this.getAttribute(\'data-name\'))">'+
      '<b>'+esc(s.name)+'</b><i>'+sign(s.chg)+f2(s.chg)+'%</i></div>';
  }).join('')+'</div>');
}

/* 用容器实测像素定位每一格：宽度取整后由 (right-left) 反算，最后一列天然贴齐右边 */
function layoutHeatmap(){
  var c=document.querySelector('.heatmap');
  if(!c) return;
  var W=c.clientWidth, H=c.clientHeight;
  if(!W||!H) return;
  Array.prototype.forEach.call(c.querySelectorAll('.hm'), function(el){
    var x=n(el.getAttribute('data-x')), y=n(el.getAttribute('data-y'));
    var w=n(el.getAttribute('data-w')), h=n(el.getAttribute('data-h'));
    var l=Math.round(x*W), t=Math.round(y*H);
    var r=Math.round((x+w)*W), b2=Math.round((y+h)*H);
    var pw=Math.max(0,r-l), ph=Math.max(0,b2-t);
    el.style.left=l+'px'; el.style.top=t+'px';
    el.style.width=pw+'px'; el.style.height=ph+'px';
    /* 极窄格（<12px）去掉 padding 与边框：border-box 下它们会把宽度顶大，造成右侧越界 */
    var roomy = pw >= 12 && ph >= 12;
    el.style.padding = roomy ? '4px 3px' : '0';
    el.style.borderWidth = roomy ? '1px' : '0';
    var fs = pw>=150?13.5 : (pw>=95?12 : (pw>=60?11 : 10));
    el.style.fontSize=fs+'px';
    var nm=el.querySelector('b'), pc=el.querySelector('i');
    if(nm) nm.style.display=(pw>=26&&ph>=24)?'':'none';
    if(pc) pc.style.display=(pw>=48&&ph>=32)?'':'none';
  });
}

/* ---------------- 持仓解锁：仓库密文 → 本机解密 ----------------
   positions.enc.json 里只有 AES-GCM 密文，密钥由口令 PBKDF2 派生；
   口令只在内存（可选本机），解密全部在浏览器里完成。 */
var ENCFILE='positions.enc.json', ENC_ITER=210000;

function b64ToBuf(s){
  var bin=atob(String(s||'')), u=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return u;
}
function bufToB64(buf){
  var u=new Uint8Array(buf), s='';
  for(var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]);
  return btoa(s);
}
function aesKey(pass,salt,iter){
  return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey'])
    .then(function(k){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},
        k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
    });
}
function decBlob(blob,pass){
  if(!blob||!blob.ct) return Promise.reject(new Error('密文格式不对'));
  var salt=b64ToBuf(blob.salt), iv=b64ToBuf(blob.iv);
  return aesKey(pass,salt,blob.iter||ENC_ITER).then(function(key){
    return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,b64ToBuf(blob.ct));
  }).then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
}
function encBlob(obj,pass){
  var salt=crypto.getRandomValues(new Uint8Array(16));
  var iv=crypto.getRandomValues(new Uint8Array(12));
  return aesKey(pass,salt,ENC_ITER).then(function(key){
    return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,
      new TextEncoder().encode(JSON.stringify(obj)));
  }).then(function(ct){
    return {v:1,kdf:'PBKDF2-SHA256',iter:ENC_ITER,
      salt:bufToB64(salt),iv:bufToB64(iv),ct:bufToB64(ct)};
  });
}
function cryptoReady(){ return !!(window.crypto&&crypto.subtle&&window.TextEncoder); }
function lockMsg(t,ok){
  var e=document.getElementById('lockMsg');
  if(e){ e.textContent=t||''; e.style.color=ok?'#148f5b':''; }

function fetchEnc(){
  if(ENC) return Promise.resolve(ENC);
  if(ENC_LOADING) return ENC_LOADING;
  ENC_LOADING=fetch(ENCFILE,{cache:'no-store'}).then(function(r){
    return r.ok?r.json():null;
  }).then(function(j){ ENC=j; ENC_LOADING=null; return j; })
   .catch(function(){ ENC_LOADING=null; return null; });
  return ENC_LOADING;
}
function applyHold(obj){
  HOLD={rows:(obj&&obj.rows)||[],cash:n(obj&&obj.cash)};
  EDIT=null; draftReset(); PERF=null;
}
function unlock(pass,quiet){
  if(!cryptoReady()){
    lockMsg('当前环境不支持浏览器解密，请用 https 或 localhost 打开。');
    return;
  }
  var el=document.getElementById('lockPass');
  var p=pass!=null?pass:((el&&el.value)||'');
  if(!p){ lockMsg('请输入口令'); return; }
  lockMsg('正在解密…',true);
  fetchEnc().then(function(blob){
    if(!blob){
      var w=document.getElementById('initWrap');
      if(w) w.style.display='block';
      lockMsg('还没有 positions.enc.json：设置一个口令创建空持仓，或点「选择加密文件」。');
      return;
    }
    return decBlob(blob,p).then(function(obj){
      PASS=p;
      applyHold(obj);
      try{ sessionStorage.setItem('etf_pass',p); }catch(e){}
      closeLock(); render();
      ensureHoldQuotes(function(){ render(); });
      flash('持仓已解锁');
    }).catch(function(){
      if(quiet) openLock();
      lockMsg('口令不对，或密文文件已损坏。');
    });
  });
}
function autoUnlock(){
  var p=null;
  try{ p=sessionStorage.getItem('etf_pass'); }catch(e){}
  if(p){ unlock(p,true); return; }
  fetchEnc().then(function(blob){
    openLock();
    if(!blob){
      var w=document.getElementById('initWrap');
      if(w) w.style.display='block';
      lockMsg('首次使用：设置一个口令创建加密持仓文件，提交到仓库后即可云端保存。');
    }
  });
}

  if(String(a).length<6){ lockMsg('口令至少 6 位'); return; }
  if(a!==b){ lockMsg('两次输入不一致'); return; }
  encBlob({rows:[],cash:0},String(a)).then(function(blob){
    downloadText(JSON.stringify(blob,null,2),ENCFILE);
    ENC=blob; PASS=String(a);
    applyHold({rows:[],cash:0});
