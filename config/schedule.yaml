# 运行调度：不区分晨间/午间，每次运行都是一版完整决策
timezone: Asia/Shanghai

# 主通道：agent 每天定时跑一版（并在你想看时按需再跑）
primary_channel: agent
fallback_channel: github_actions

run:
  daily_at: '07:30'               # 北京时间；留足到 09:30 开盘前的余量
  on_demand: true                 # 随时手动/agent 触发

channels:
  agent:
    enabled: true
    command: 'python3 scripts/run_update.py'
  github_actions:
    enabled: true
    workflow: '.github/workflows/daily.yml'
    cron: '30 23 * * 0-4'         # UTC 23:30 = 北京 07:30（周一到周五盘前）
    artifacts: [web/index.html, data/last_run.json]

# 页面「刷新行情」按钮只更新价格（免费 JSONP），不重算指标。
# 指标（均线/分诊/条件单）必须由脚本重跑，两者语义不同，不要混淆。
refresh:
  quotes_endpoint: 'https://qt.gtimg.cn/q='
  note: '浏览器端只刷新最新价与涨跌幅；折溢价与均线状态需重跑脚本'
  # 想用本机 IP 取数并回填 GitHub（云机房 IP 常被东财限流），本地执行：
  #   python3 scripts/run_update.py --push
  local_push: 'python3 scripts/run_update.py --push'

boundaries:                       # 明确不做
  - 不接券商交易接口
  - 不做盘中轮询 / websocket / 实时监控
  - 不代客理财、不承诺盈利
