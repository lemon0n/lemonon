# 策略阈值参数（均线 / 量能 / 结构 / 分诊 / 打分）
# 规则文本与出处统一维护在 config/methodology.yaml（蒸馏规则卡）。
# 指标实现唯一来源：src/etfquant/features.py（生产与回测共用）。
ma:
  periods: [5, 10, 20, 60, 120]
  stand_back: 收盘价 > MA5
  add_requires_days_above_ma5: 3
  stop_ma: 10
  # 回退到方法论默认 2 日：此前的「1 日」由已被撤回的回测选参而来（见 docs/回测报告.md），
  # 在时间外验证完成前不再沿用该优化值。
  stop_consecutive_days: 2
  stop_buy2_ma: 5
  tangle_atr_pct: 0.012
  cross_signal: MA5 上穿 MA20

breakout:
  true_all_of:
    - 不破关键位
    - 明显缩量
    - 慢跌快涨
    - 有承接
  false_if: [放量下跌, 跌破重要均线]
  shrink_ratio: 0.80
  expand_ratio: 1.30
  main_cost_ma: 10
  abandon_ma: 20

cycle:
  fib: [0.382, 0.618]

triage:
  # 分诊阈值全部由 config/methodology.yaml 的规则卡定义；这里只保留展示用文案
  levels: [D, C, A, B]

score:
  # 量能特征分（只由量比与缩量回踩构成，不冒充资金流向）
  weights: {momentum: 0.30, fund: 0.25, trend: 0.30, premium: 0.15}
  premium_penalty_threshold_pct: 1.0

# 回测参数：仅保留成本与执行假设；信号本身必须来自生产规则卡，不再在此维护「简化版策略」。
# 旧 3 轮优化结果已按指导书 P0-1 撤回，见 docs/回测报告.md 的冻结说明。
backtest:
  start: '2023-01-01'
  end: '2026-11-12'
  initial_cash: 100000.0
  fee_bps: 0.5
  min_commission_cny: 5.0
  slippage_bps: 1.0
  lot_size: 100
  max_legs: 6
  leg_weight_pct: 15.0
  warmup_bars: 130
