# 规则卡 v2.0 —— 唯一决策事实源（生产持仓 / 观察池 / 网页 / 报告 / 回测共用）
#
# 与 v1.x 的差异：
#   1. 只有一套动作求值：methodology.decide()。不再有 triage.py 的第二套 A/B/C/D；
#   2. 谓词必须在 WHITELIST 内，未知谓词 / 重复 ID / 非法动作 → 启动即失败，
#      不允许用 always→HOLD 掩盖配置拼写错误；
#   3. 名称改为可观测定义：不再使用「主力放弃 / 真出货 / 诱多」等不可观测因果断言；
#   4. CLEAR 的语义是「目标份额为 0」，价格只是执行政策（限价保护），不保证成交，
#      不再为清仓单附加普通做多止盈腿。
version: '2.0'

meta:
  distill_doc: docs/archive/沉关河方法论蒸馏.md
  corpus_articles: 41
  rules_total: 11

actions:
  CLEAR: 清仓
  TRIM: 分批减仓
  ADD: 加仓
  HOLD: 持有
  WATCH: 观察

levels:
  D: {label: 风险退出, rank: 4}
  C: {label: 减仓保利, rank: 3}
  A: {label: 可加仓, rank: 2}
  B: {label: 等待确认, rank: 1}

# 谓词白名单：methodology.py / app.js 都必须实现这同一组键。
predicates:
  below_ma10_days_gte: 连续收盘低于 MA10 的日数 >= N
  false_breakout: 放量下跌且收盘低于 MA20（可观测事件）
  expand_down_break_ma20: 放量、当日跌幅 < -2%、收盘低于 MA20
  not_stand_back_expand: 未站上 MA5 且放量
  upper_shadow_gt: 倒数第三根 K 线上影线 % > N（生产/回测同一根）
  not_stand_back_premium_gt: 未站上 MA5 且折溢价 % > N（IOPV 缺失时不命中）
  stand_back_days_gte: 收盘站上 MA5 且连续日数 >= N
  true_breakout: 突破四条全部满足
  is_20d_low: 收盘为 20 日新低
  always: 恒真（仅允许用于最低优先级的兜底规则）

rules:
  - id: R-D1
    level: D
    priority: 100
    name: 收盘跌破MA10
    when: {below_ma10_days_gte: 2}
    action: CLEAR
    text: 收盘连续低于 MA10 达 2 日（可观测：收盘价与 MA10 的比较）
    src: '3657'
    rationale:
      phen: 收盘价连续低于 MA10。
      judge: 规则只陈述「收盘低于 MA10」这一可观测事实；它不推断任何主体的意图。历史检验需按时间外样本验证该定义是否优于简单基准。
      act: 目标份额降至 0；执行价格为下一可交易时段的限价保护，不保证成交价。
    exec: 次日以限价分笔卖出；低开且流动性不足时按可成交价格优先，不追加摊薄。
  - id: R-D2
    level: D
    priority: 99
    name: 放量下跌破MA20
    when: {false_breakout: true}
    action: CLEAR
    text: 放量 + 收盘下跌 + 收盘低于 MA20（可观测组合）
    src: '3657'
    rationale:
      phen: 当日量比放大、收盘下跌且收盘低于 MA20。
      judge: 这是三个可观测条件的组合，不是对资金意图的判断；是否有效需时间外验证。
      act: 目标份额降至 0。
    exec: 确认当日收盘后生成卖出政策，次日执行。
  - id: R-D3
    level: D
    priority: 98
    name: 放量破位
    when: {expand_down_break_ma20: true}
    action: CLEAR
    text: 放量且跌幅超 2% 且收盘低于 MA20
    src: '3657'
    rationale:
      phen: 放量、当日跌幅超过 2%、收盘低于 MA20。
      judge: 放量下跌叠加均线破位属高波动事件，规则在此选择退出而不是预测反弹。
      act: 目标份额降至 0。
    exec: 次日限价卖出；未成交部分保留到下一可交易日。
  - id: R-D4
    level: D
    priority: 97
    name: 20日新低
    when: {is_20d_low: true, below_ma10_days_gte: 1}
    action: CLEAR
    text: 收盘创 20 日新低且低于 MA10
    src: '3657'
    rationale:
      phen: 收盘价等于或低于近 20 日最低收盘，且低于 MA10。
      judge: 这是趋势与位置的客观描述（新低 + 均线下方），不含对交易对手意图的推断。
      act: 目标份额降至 0。
    exec: 次日执行；若次日跳空低开，限价保护可能无法成交，按未成交政策处理。
  - id: R-C1
    level: C
    priority: 80
    name: 未站上MA5且放量
    when: {not_stand_back_expand: true}
    action: TRIM
    text: 收盘未站上 MA5 且量比放大
    src: '7477/7570'
    rationale:
      phen: 收盘价低于 MA5，且当日量比高于放量阈值。
      judge: 该组合描述「价格未回到短期均线上方、成交放大」，属于风险提示而非因果断言。
      act: 目标权重减半（TRIM），保留剩余仓位。
    exec: 次日限价减仓一半；剩余仓位按下一交易日重新求值。
  - id: R-C2
    level: C
    priority: 79
    name: 上影线超阈值
    when: {upper_shadow_gt: 2}
    action: TRIM
    text: 倒数第三根 K 线上影线超过 2%
    src: '7477'
    rationale:
      phen: 指定 K 线的上影线占收盘价比例超过 2%。
      judge: 上影线长度是价格拒绝的几何描述，不推断买卖方身份。
      act: 目标权重减半。
    exec: 次日执行；若当日已触发 D 级规则，D 级优先。
  - id: R-C3
    level: C
    priority: 78
    name: 折溢价偏高
    when: {not_stand_back_premium_gt: 1.0}
    action: TRIM
    text: 收盘未站上 MA5 且折溢价高于 1%（IOPV 缺失时不命中）
    src: '7477'
    rationale:
      phen: 未站上 MA5 且 IOPV 折溢价高于 1%。
      judge: 溢价表示价格高于实时估值，买入成本更高；这是可观测的定价偏差。
      act: 目标权重减半；IOPV 缺失时该规则不参与判定（缺失不等于满足）。
    exec: 等溢价回落到 0.5% 以内再考虑加仓。
  - id: R-A1
    level: A
    priority: 60
    name: 站上MA5且突破四条
    when: {stand_back_days_gte: 3, true_breakout: true}
    action: ADD
    text: 收盘站上 MA5 满 3 日且突破四条全中
    src: '3657/7879'
    rationale:
      phen: 连续 3 日收盘高于 MA5；突破四条（不破关键位、明显缩量、慢跌快涨、有承接）全部满足。
      judge: 规则把「站上均线 + 四条结构条件」作为候选加仓条件；其有效性必须由时间外回测证明，不能默认成立。
      act: 在组合约束允许时加仓；超配 / 浮亏超阈值时由覆盖规则降级为持有。
    exec: 分批进场，回踩 MA5 附近先半仓；止损条件在开仓前确定。
  - id: R-A2
    level: A
    priority: 50
    name: 站上MA5确认
    when: {stand_back_days_gte: 2}
    action: HOLD
    text: 收盘站上 MA5 满 2 日（未满 3 日不加仓）
    src: '7879'
    rationale:
      phen: 连续 2 日收盘高于 MA5。
      judge: 仅表示短期价格回到 MA5 上方，尚不满足加仓条件。
      act: 持有，不加仓。
    exec: 跌破 MA10 当日重新求值并降级。
  - id: R-B1
    level: B
    priority: 20
    name: 缺确认等待
    when: {always: true}
    action: HOLD
    text: 未命中任何明确条件（兜底：持有等待）
    src: '8231'
    rationale:
      phen: 未满足任何具有明确阈值的规则。
      judge: 兜底规则只表示「没有可执行信号」，不代表趋势判断。
      act: 持有，等待下一交易日重新求值。
    exec: 不加仓、不减仓。

# S5 组合层简报模板
brief:
  header_phen: '市场状态「{regime}」，仓位区间 {lo}~{hi}%；当前总仓位 {pos}%，{pos_state}；今日待执行 {n} 笔'
  header_judge: '{regime_note}'
  header_act: '今日动作：{acts}；先降风险敞口，再调结构'
  no_action: '今日无触发动作：全部规则求值为持有，下一交易日重新求值'

# 参考价位语义（与 pricing.py 一致）
#   buy  : entry < 现价（回踩支撑），stop < entry，tp > 现价
#   sell : entry > 现价（反弹限价），stop < 现价，tp = 现价上方参考阻力
#   CLEAR: 目标份额 0；只给限价保护与观察阻力，不附普通做多止盈腿
pricing:
  ADD:   {side: buy,  entry: pullback_ma5, stop: support_below, tp: reference_resistance}
  HOLD:  {side: buy,  entry: pullback_ma5, stop: support_below, tp: reference_resistance}
  WATCH: {side: buy,  entry: pullback_ma5, stop: support_below, tp: reference_resistance}
  TRIM:  {side: sell, entry: bounce_up,    stop: support_below, tp: reference_resistance}
  CLEAR: {side: sell, entry: bounce_up,    stop: null,          tp: null, target_shares: 0}

# 组合层覆盖规则（只作用于 ADD）
overrides:
  - {id: O-1, name: 超配禁加仓, when: position_pct_gt_regime_hi, demote: ADD->HOLD, src: '3657',
     text: 总仓位高于阶段区间上限，ADD 降级为 HOLD,
     rationale: '超配时先降总仓，不新增敞口'}
  - {id: O-2, name: 浮亏禁加仓, when: pnl_pct_lt_-8, demote: ADD->HOLD, src: 'L4-08',
     text: 单腿浮亏超过 -8%，ADD 降级为 HOLD,
     rationale: '成本价锚定不应驱动加仓；先核对风险预算再决定'}
  - {id: O-3, name: 大浮盈不加仓, when: pnl_pct_gt_30, demote: ADD->HOLD, src: 'L4-09',
     text: 单腿浮盈超过 +30%，ADD 降级为 HOLD,
     rationale: '大额浮盈时不追高，先检查集中度'}
  - {id: O-4, name: 数据不足不出单, when: data_status_not_ok, demote: any->ABSTAIN, src: 'P0',
     text: 关键数据缺失 / 陈旧 / 冲突，禁止输出交易动作,
     rationale: '数据不足不等于持有；状态必须为 ABSTAIN'}

# 市场状态 → 适配仓位（由可观测指数序列计算，不使用叙事标签）
regime_fit:
  上行趋势:            {lo: 80, hi: 90}
  震荡区间:            {lo: 60, hi: 70}
  下行趋势:            {lo: 30, hi: 40}
  下行趋势 · 波动抬升:  {lo: 20, hi: 30}
  上行趋势 · 波动抬升:  {lo: 60, hi: 70}
  未知:                {lo: null, hi: null}

pipeline:
  - {step: S1, name: 市场定仓, output: [regime, fit_lo, fit_hi, position_pct, position_action]}
  - {step: S2, name: 结构核对, output: [category, current_pct_of_invested, target_pct_of_invested, deviation_pct]}
  - {step: S3, name: 逐只评级, output: [code, name, level, action, hits]}
  - {step: S4, name: 动作生成, output: [code, action, entry, stop, tp, rule_ids, target_weight_pct]}
  - {step: S5, name: 组合输出, output: [orders, target_shares, portfolio_after, risk_flags]}

sentiment_cycle: [亢奋, 分歧, 退潮, 冰点, 回暖, 再亢奋]
