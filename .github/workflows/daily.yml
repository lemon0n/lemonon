name: 每日更新

# 日常更新由 Trae 定时任务（工作日 07:00 北京时间）执行 `bash scripts/daily.sh`，
# 直接推送产物到 main 并触发 Pages 部署。
# 本 workflow 仅保留手动触发（workflow_dispatch），用于调试或手动补跑。

on:
  workflow_dispatch:
    inputs:
      strict:
        description: '严格模式：状态非 OK（降级/弃权/演示）就判失败'
        required: false
        default: 'false'

concurrency:
  group: etf-daily-update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'          # 决策契约测试需要 node 对拍前端规则引擎

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 单元测试（不触网，先挡住逻辑与契约回归）
        run: python -m pytest tests/ -q

      - name: 生成当日决策（实时取数，失败自动降级）
        id: run
        run: |
          set +e
          for i in 1 2 3; do
            echo "--- 第 $i 次尝试 ---"
            python scripts/run_update.py --json > run.json
            code=$?
            if [ "$code" = "0" ] || [ "$code" = "4" ]; then break; fi
            echo "退出码 $code，60 秒后重试"
            sleep 60
          done
          python - <<'PY'
          import json
          d = json.load(open('run.json'))
          status = d.get('status')
          val = d.get('validation') or {}
          lines = [
            '状态 %s · 数据日 %s · 来源 %s' % (
                status, d.get('data_date'),
                '实时' if not d.get('degraded') else '降级'),
            '标的 %s 只 · 动作 %s' % (d.get('levels'), d.get('action_count')),
            '发布前校验：%s' % ('通过' if val.get('ok') else '未通过'),
          ]
          if val.get('errors'):
              lines.append('校验错误：' + '；'.join(val['errors']))
          fb = (d.get('source') or {}).get('fallback') or []
          if fb:
              lines.append('降级明细：')
              lines += ['- ' + x for x in fb]
          open('summary.md', 'w', encoding='utf-8').write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY
          cat summary.md >> $GITHUB_STEP_SUMMARY
          exit $code

      - name: 提交产物（触发 Pages 重新发布）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/index.html web/analysis_packet.json data/last_run.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 每日更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              if git push; then exit 0; fi
              echo "推送被拒，拉取远端后重试（第 $i 次）"
              git pull --rebase --autostash origin main
            done
            exit 1
          fi

      - name: 归档产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-dashboard-${{ github.run_number }}
          path: |
            web/index.html
            web/analysis_packet.json
            data/last_run.json
            run.json
          retention-days: 30

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
